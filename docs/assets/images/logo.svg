<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" fill="none">
  <!-- Outer Glow -->
  <circle cx="50" cy="50" r="40" fill="#7f6df2" opacity="0.15" filter="blur(10px)" />
  <!-- Obsidian Crystal Shape with custom facets -->
  <polygon points="50,10 80,40 50,55" fill="#907ef7" />
  <polygon points="50,10 20,40 50,55" fill="#725ee9" />
  <polygon points="20,40 50,90 50,55" fill="#5c49d3" />
  <polygon points="80,40 50,90 50,55" fill="#7f6df2" />
  <!-- Core glowing connection / memory node (Kioku) -->
  <circle cx="50" cy="50" r="8" fill="#cdd9f0" />
  <line x1="50" y1="50" x2="35" y2="35" stroke="#cdd9f0" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="50" x2="65" y2="35" stroke="#cdd9f0" stroke-width="2.5" stroke-linecap="round" />
  <line x1="50" y1="50" x2="50" y2="70" stroke="#cdd9f0" stroke-width="2.5" stroke-linecap="round" />
  <circle cx="35" cy="35" r="4.5" fill="#8ab4fa" />
  <circle cx="65" cy="35" r="4.5" fill="#8ab4fa" />
  <circle cx="50" cy="70" r="4.5" fill="#8ab4fa" />
</svg>
