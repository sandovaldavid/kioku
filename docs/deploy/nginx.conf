# Kioku MCP Server — nginx reverse proxy (HTTPS via Tailscale or self-signed cert)
#
# Copy to: /etc/nginx/sites-available/kioku
# Enable:  sudo ln -s /etc/nginx/sites-available/kioku /etc/nginx/sites-enabled/kioku
# Reload:  sudo nginx -t && sudo systemctl reload nginx

server {
    listen 443 ssl;
    listen [::]:443 ssl;

    # Tailscale hostname or internal IP
    server_name kioku.internal;

    ssl_certificate     /etc/ssl/kioku/kioku.crt;
    ssl_certificate_key /etc/ssl/kioku/kioku.key;

    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    location / {
        proxy_pass http://127.0.0.1:5173;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE: disable buffering so events are streamed immediately
        proxy_buffering    off;
        proxy_cache        off;
        proxy_read_timeout 3600s;

        # SSE content type passthrough
        proxy_set_header   Accept-Encoding "";
    }

    # Public health endpoint — no auth required
    location /health {
        proxy_pass http://127.0.0.1:5173/health;
        proxy_buffering off;
    }
}

# Redirect HTTP → HTTPS
server {
    listen 80;
    listen [::]:80;
    server_name kioku.internal;
    return 301 https://$host$request_uri;
}
