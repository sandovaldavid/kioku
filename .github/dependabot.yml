version: 2

updates:
  # C# MCP server
  - package-ecosystem: "nuget"
    directory: "/src/Kioku.Mcp.Server"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "server"

  # C# server test suite
  - package-ecosystem: "nuget"
    directory: "/src/Kioku.Mcp.Server.Tests"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "server"

  # commands-reference generator script
  - package-ecosystem: "nuget"
    directory: "/scripts/GenerateCommandsRef"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "server"

  # performance benchmarks project
  - package-ecosystem: "nuget"
    directory: "/scripts/Kioku.Benchmarks"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "server"

  # pnpm workspace (root tooling + Obsidian plugin)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "plugin"

  # GitHub Actions workflows
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(ci)"
    labels:
      - "dependencies"
      - "ci"

  # Docker base images
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "weekly"
    groups:
      minor-and-patch:
        update-types: ["minor", "patch"]
    commit-message:
      prefix: "chore(deps)"
    labels:
      - "dependencies"
      - "docker"
