name: patch-test-compat

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/enforce-filesystem-sandbox' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Patch compatibility tests
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new, label):
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected one match, found {count}')
              file.write_text(text.replace(old, new), encoding='utf-8')

          path = 'src/Kioku.Mcp.Server.Tests/WriteToolIntegrationTests.cs'
          replace_once(
              path,
              '    private NoteCommandTools CreateTools()\n    {\n        var config = new KiokuConfiguration { VaultPath = _fixture.VaultPath };',
              '''    private NoteCommandTools CreateTools(bool allowPermanentDelete = false)
              {
                  var config = new KiokuConfiguration
                  {
                      VaultPath = _fixture.VaultPath,
                      AllowPermanentDelete = allowPermanentDelete,
                  };''',
              'test helper configuration')
          replace_once(
              path,
              '''    public async Task DeleteNote_PermanentDelete_RemovesFile()
              {
                  var tools = CreateTools();''',
              '''    public async Task DeleteNote_PermanentDelete_RemovesFile()
              {
                  var tools = CreateTools(allowPermanentDelete: true);''',
              'permanent delete opt-in')

          path = 'src/Kioku.Mcp.Server.Tests/PermanentDeletePolicyTests.cs'
          replace_once(
              path,
              '        Assert.NotNull(_fixture.Index.GetNote("Delete/Protected"));',
              '        Assert.NotNull(_fixture.Index.ResolveNote("Delete/Protected"));',
              'index assertion')
          PY

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj

      - name: Format tests
        run: dotnet format src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj --no-restore --verbosity minimal

      - name: Commit test compatibility
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Kioku.Mcp.Server.Tests
          git commit -m "test: align filesystem sandbox expectations"
          git push origin HEAD:${{ github.head_ref }}