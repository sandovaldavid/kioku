name: format-sandbox-final

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/enforce-filesystem-sandbox' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Restore server
        run: dotnet restore src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj

      - name: Restore tests
        run: dotnet restore src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj

      - name: Format server
        run: dotnet format src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj --no-restore --verbosity minimal

      - name: Format tests
        run: dotnet format src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj --no-restore --verbosity minimal

      - name: Commit formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git diff --quiet; then
            echo "No formatting changes required."
            exit 0
          fi
          git add src/Kioku.Mcp.Server src/Kioku.Mcp.Server.Tests
          git commit -m "style: format filesystem sandbox changes"
          git push origin HEAD:${{ github.head_ref }}