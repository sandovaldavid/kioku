name: refresh-mcp-sdk-lockfiles

on:
  pull_request:
    branches:
      - develop
    paths:
      - Directory.Packages.props
      - '**/packages.lock.json'
      - .github/workflows/refresh-mcp-sdk-lockfiles.yml

permissions:
  contents: write

jobs:
  refresh-lockfiles:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request branch
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.x

      - name: Refresh NuGet lockfiles
        run: dotnet restore Kioku.slnx --force-evaluate -p:RestoreLockedMode=false

      - name: Commit regenerated lockfiles
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- '**/packages.lock.json'; then
            echo 'NuGet lockfiles are already current.'
            exit 0
          fi

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- '**/packages.lock.json'
          git commit -m 'chore(deps): refresh MCP SDK lockfiles'
          git push origin "HEAD:${{ github.event.pull_request.head.ref }}"
