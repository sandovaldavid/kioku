name: temporary-audit-401-capability

on:
  push:
    branches: [fix/audit-pagination-401]

permissions:
  contents: write

jobs:
  fixup:
    if: ${{ !contains(github.event.head_commit.message, 'enable organization in package smoke') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/audit-pagination-401
          fetch-depth: 0

      - name: Enable organization tools in package-smoke profile
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('.github/workflows/ci.yml')
          text = path.read_text()
          old = "printf 'capabilities:\\n  require_explicit: true\\n  enabled:\\n    - coordination\\n    - sessions\\n' > \"$VAULT/.kioku/config.yml\""
          new = "printf 'capabilities:\\n  require_explicit: true\\n  enabled:\\n    - coordination\\n    - sessions\\n    - organization\\n' > \"$VAULT/.kioku/config.yml\""
          count = text.count(old)
          if count != 2:
              raise SystemExit(f'expected 2 package-smoke capability fixtures, found {count}')
          path.write_text(text.replace(old, new))
          PY

      - name: Commit fix and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-audit-401-capability.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "test(ci): enable organization in package smoke"
          git push origin HEAD:fix/audit-pagination-401
