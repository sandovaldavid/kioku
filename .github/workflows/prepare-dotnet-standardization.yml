name: prepare-dotnet-standardization

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'agent/dotnet-repo-standardization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/dotnet-repo-standardization

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Standardize .NET repository files
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def write(path: str, content: str) -> None:
              target = Path(path)
              target.parent.mkdir(parents=True, exist_ok=True)
              target.write_text(content.strip() + "\n", encoding="utf-8")

          write("global.json", r'''
          {
            "sdk": {
              "version": "10.0.100",
              "rollForward": "latestFeature",
              "allowPrerelease": false
            }
          }
          ''')

          write("Directory.Build.props", r'''
          <Project>
            <PropertyGroup>
              <TargetFramework>net10.0</TargetFramework>
              <Nullable>enable</Nullable>
              <ImplicitUsings>enable</ImplicitUsings>
              <LangVersion>latest</LangVersion>
              <Deterministic>true</Deterministic>
              <ContinuousIntegrationBuild Condition="'$(CI)' == 'true'">true</ContinuousIntegrationBuild>
              <EnableNETAnalyzers>true</EnableNETAnalyzers>
              <AnalysisLevel>latest-recommended</AnalysisLevel>
              <EnforceCodeStyleInBuild>true</EnforceCodeStyleInBuild>
              <TreatWarningsAsErrors>true</TreatWarningsAsErrors>
            </PropertyGroup>

            <ItemGroup Condition="'$(MSBuildProjectExtension)' == '.csproj'">
              <PackageReference Include="Microsoft.CodeAnalysis.NetAnalyzers" PrivateAssets="all" />
            </ItemGroup>
          </Project>
          ''')

          write("Directory.Packages.props", r'''
          <Project>
            <PropertyGroup>
              <ManagePackageVersionsCentrally>true</ManagePackageVersionsCentrally>
              <CentralPackageTransitivePinningEnabled>true</CentralPackageTransitivePinningEnabled>
            </PropertyGroup>

            <ItemGroup>
              <PackageVersion Include="BenchmarkDotNet" Version="0.15.8" />
              <PackageVersion Include="coverlet.collector" Version="10.0.1" />
              <PackageVersion Include="Markdig" Version="1.3.2" />
              <PackageVersion Include="Microsoft.CodeAnalysis.NetAnalyzers" Version="10.0.0" />
              <PackageVersion Include="Microsoft.NET.Test.Sdk" Version="18.7.0" />
              <PackageVersion Include="ModelContextProtocol" Version="1.4.1" />
              <PackageVersion Include="ModelContextProtocol.AspNetCore" Version="1.4.1" />
              <PackageVersion Include="Sentry.AspNetCore" Version="6.6.0" />
              <PackageVersion Include="xunit" Version="2.9.3" />
              <PackageVersion Include="xunit.runner.visualstudio" Version="3.1.5" />
              <PackageVersion Include="YamlDotNet" Version="18.1.0" />
            </ItemGroup>
          </Project>
          ''')

          write("NuGet.config", r'''
          <?xml version="1.0" encoding="utf-8"?>
          <configuration>
            <packageSources>
              <clear />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          ''')

          write("src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj", r'''
          <Project Sdk="Microsoft.NET.Sdk.Web">

            <PropertyGroup>
              <RuntimeIdentifiers>win-x64;win-arm64;osx-x64;osx-arm64;linux-x64;linux-arm64;linux-musl-x64</RuntimeIdentifiers>
              <OutputType>Exe</OutputType>

              <!-- API-only server: no wwwroot/Razor content, so static web assets add nothing but
                   RID-path complications for `dotnet pack`. -->
              <StaticWebAssetsEnabled>false</StaticWebAssetsEnabled>

              <!-- Runtime-specific builds and publishes remain self-contained. Solution-level
                   builds stay framework-dependent so every project can build without choosing a RID. -->
              <SelfContained Condition="'$(RuntimeIdentifier)' != ''">true</SelfContained>
              <PublishSelfContained Condition="'$(RuntimeIdentifier)' != ''">true</PublishSelfContained>
              <PublishSingleFile Condition="'$(RuntimeIdentifier)' != ''">true</PublishSingleFile>

              <!-- Kioku package metadata -->
              <IsPackable>true</IsPackable>
              <PackAsTool>true</PackAsTool>
              <ToolCommandName>kioku</ToolCommandName>
              <PackageType>McpServer</PackageType>
              <PackageReadmeFile>README.md</PackageReadmeFile>
              <PackageId>kioku-mcp-server</PackageId>
              <PackageVersion>2.3.0</PackageVersion>
              <PackageLicenseFile>LICENSE</PackageLicenseFile>
              <PackageTags>AI; MCP; obsidian; notes; server; stdio; streamable-http</PackageTags>
              <Description>Kioku — MCP server for Obsidian vault access. Enables AI agents to search, read and write notes via the Model Context Protocol.</Description>
              <Authors>sandovaldavid</Authors>
              <Copyright>Copyright © 2026 sandovaldavid</Copyright>

              <!-- Trimming analysis to prepare for v3 (Native AOT) -->
              <TrimmerRootDescriptor>TrimmerRoots.xml</TrimmerRootDescriptor>
            </PropertyGroup>

            <ItemGroup>
              <EmbeddedResource Include="Resources/Templates/AgentWorkflow/*.md" />
            </ItemGroup>

            <ItemGroup>
              <None Include=".mcp\server.json" Pack="true" PackagePath="/.mcp/" />
              <None Include="README.md" Pack="true" PackagePath="/" />
              <None Include="../../LICENSE" Pack="true" PackagePath="/" />
            </ItemGroup>

            <ItemGroup>
              <AssemblyAttribute Include="System.Runtime.CompilerServices.InternalsVisibleTo">
                <_Parameter1>Kioku.Mcp.Server.Tests</_Parameter1>
              </AssemblyAttribute>
            </ItemGroup>

            <ItemGroup>
              <PackageReference Include="Markdig" />
              <PackageReference Include="ModelContextProtocol" />
              <PackageReference Include="ModelContextProtocol.AspNetCore" />
              <PackageReference Include="Sentry.AspNetCore" />
              <PackageReference Include="YamlDotNet" />
            </ItemGroup>

          </Project>
          ''')

          write("src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj", r'''
          <Project Sdk="Microsoft.NET.Sdk">

            <PropertyGroup>
              <IsPackable>false</IsPackable>
              <IsTestProject>true</IsTestProject>
            </PropertyGroup>

            <ItemGroup>
              <PackageReference Include="coverlet.collector">
                <PrivateAssets>all</PrivateAssets>
                <IncludeAssets>runtime; build; native; contentfiles; analyzers; buildtransitive</IncludeAssets>
              </PackageReference>
              <PackageReference Include="Microsoft.NET.Test.Sdk" />
              <PackageReference Include="xunit" />
              <PackageReference Include="xunit.runner.visualstudio">
                <PrivateAssets>all</PrivateAssets>
                <IncludeAssets>runtime; build; native; contentfiles; analyzers; buildtransitive</IncludeAssets>
              </PackageReference>
            </ItemGroup>

            <ItemGroup>
              <ProjectReference Include="..\Kioku.Mcp.Server\Kioku.Mcp.Server.csproj" />
            </ItemGroup>

            <ItemGroup>
              <None Include="Fixtures\**\*.bib" CopyToOutputDirectory="PreserveNewest" />
              <None Include="Fixtures\**\*.md" CopyToOutputDirectory="PreserveNewest" />
              <None Include="Fixtures\golden-set.json" CopyToOutputDirectory="PreserveNewest" />
            </ItemGroup>

          </Project>
          ''')

          write("scripts/Kioku.Benchmarks/Kioku.Benchmarks.csproj", r'''
          <Project Sdk="Microsoft.NET.Sdk">

            <PropertyGroup>
              <OutputType>Exe</OutputType>
            </PropertyGroup>

            <ItemGroup>
              <PackageReference Include="BenchmarkDotNet" />
            </ItemGroup>

            <ItemGroup>
              <ProjectReference Include="..\..\src\Kioku.Mcp.Server\Kioku.Mcp.Server.csproj" />
            </ItemGroup>

          </Project>
          ''')

          write("scripts/Kioku.Eval/Kioku.Eval.csproj", r'''
          <Project Sdk="Microsoft.NET.Sdk">

            <PropertyGroup>
              <OutputType>Exe</OutputType>
            </PropertyGroup>

            <ItemGroup>
              <ProjectReference Include="..\..\src\Kioku.Mcp.Server\Kioku.Mcp.Server.csproj" />
            </ItemGroup>

          </Project>
          ''')

          write("scripts/GenerateCommandsRef/GenerateCommandsRef.csproj", r'''
          <Project Sdk="Microsoft.NET.Sdk">
            <PropertyGroup>
              <OutputType>Exe</OutputType>
            </PropertyGroup>
          </Project>
          ''')

          contributing = Path("CONTRIBUTING.md").read_text(encoding="utf-8")
          contributing = contributing.replace(
              """# Server (requires .NET 10 SDK)\ndotnet build src/Kioku.Mcp.Server/\ndotnet test src/Kioku.Mcp.Server.Tests/""",
              """# .NET projects (requires .NET 10 SDK)\ndotnet restore Kioku.slnx\ndotnet build Kioku.slnx --configuration Release --no-restore\ndotnet test Kioku.slnx --configuration Release --no-build""",
          )
          contributing = contributing.replace(
              """- **C#**: format with `dotnet format src/Kioku.Mcp.Server/` before committing. No""",
              """- **C#**: format with `dotnet format Kioku.slnx` before committing. Repository-wide\n  nullable, deterministic build, code-style, analyzer, and warnings-as-errors settings live in\n  `Directory.Build.props`; package versions live in `Directory.Packages.props`. No""",
          )
          contributing = contributing.replace(
              """dotnet build src/Kioku.Mcp.Server/\ndotnet run --project scripts/GenerateCommandsRef""",
              """dotnet build Kioku.slnx --configuration Release\ndotnet run --project scripts/GenerateCommandsRef""",
          )
          contributing = contributing.replace(
              """- Server: `dotnet test src/Kioku.Mcp.Server.Tests/` — please add tests for new tools and""",
              """- Server: `dotnet test Kioku.slnx --configuration Release` — please add tests for new tools and""",
          )
          contributing = contributing.replace(
              """1. Make sure `dotnet build`, `dotnet test`, and `dotnet format --verify-no-changes` are\n   all green for anything touching the server (equivalent `pnpm` commands for the plugin).""",
              """1. For .NET changes, run the single repository verification command below (equivalent\n   `pnpm` commands apply to plugin changes):\n\n   ```bash\n   dotnet restore Kioku.slnx && dotnet build Kioku.slnx -c Release --no-restore && dotnet test Kioku.slnx -c Release --no-build && dotnet format Kioku.slnx --verify-no-changes --no-restore\n   ```""",
          )
          Path("CONTRIBUTING.md").write_text(contributing, encoding="utf-8")
          PY

          rm -f Kioku.sln Kioku.slnx
          dotnet new sln --name Kioku --format slnx
          dotnet sln Kioku.slnx add \
            src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj \
            src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj \
            scripts/Kioku.Benchmarks/Kioku.Benchmarks.csproj \
            scripts/Kioku.Eval/Kioku.Eval.csproj \
            scripts/GenerateCommandsRef/GenerateCommandsRef.csproj

      - name: Validate restore and solution membership
        run: |
          dotnet restore Kioku.slnx
          dotnet sln Kioku.slnx list

      - name: Commit standardized .NET repository files
        shell: bash
        env:
          HUSKY: "0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Kioku.slnx \
            global.json \
            Directory.Build.props \
            Directory.Packages.props \
            NuGet.config \
            CONTRIBUTING.md \
            src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj \
            src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj \
            scripts/Kioku.Benchmarks/Kioku.Benchmarks.csproj \
            scripts/Kioku.Eval/Kioku.Eval.csproj \
            scripts/GenerateCommandsRef/GenerateCommandsRef.csproj
          git commit --no-verify -m "chore(repo): standardize dotnet solution and package management"
          git push origin HEAD:agent/dotnet-repo-standardization
