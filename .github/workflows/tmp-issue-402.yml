name: tmp-issue-402

on:
  push:
    branches:
      - fix/audit-template-placeholders-402

permissions:
  contents: write

jobs:
  implement-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/audit-template-placeholders-402
          fetch-depth: 0

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Apply issue 402 implementation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f"marker not found in {path}: {old[:80]!r}")
              p.write_text(text.replace(old, new, 1))

          # Templater: expose the configured templates root independently from folder-template mode.
          path = Path("src/Kioku.Mcp.Server/Services/TemplaterFolderTemplates.cs")
          text = path.read_text()
          marker = "    /// <summary>\n    /// Adds folder→template entries to Templater's own settings"
          method = '''    /// <summary>\n    /// Reads Templater's configured template root (<c>templates_folder</c>). This setting is\n    /// independent from Folder Templates, so it is returned even when\n    /// <c>enable_folder_templates</c> is false. Missing, blank, or malformed settings return null.\n    /// </summary>\n    public static async Task<string?> ReadTemplatesFolderAsync(string vaultPath)\n    {\n        var path = SettingsPath(vaultPath);\n        if (!File.Exists(path))\n        {\n            return null;\n        }\n\n        try\n        {\n            using var stream = File.OpenRead(path);\n            using var doc = await JsonDocument.ParseAsync(stream);\n            var root = doc.RootElement;\n            if (!root.TryGetProperty("templates_folder", out var folderEl) ||\n                folderEl.ValueKind != JsonValueKind.String)\n            {\n                return null;\n            }\n\n            var folder = folderEl.GetString()?.Trim();\n            return string.IsNullOrWhiteSpace(folder) ? null : folder;\n        }\n        catch (JsonException)\n        {\n            return null;\n        }\n    }\n\n'''
          if marker not in text:
              raise SystemExit("Templater marker not found")
          path.write_text(text.replace(marker, method + marker, 1))

          # Vault config: expose explicitly configured template files for audit classification.
          replace_once(
              "src/Kioku.Mcp.Server/Services/VaultConfigService.cs",
              '    public string? ConfiguredInbox => GetFolder("inbox");\n',
              '''    public string? ConfiguredInbox => GetFolder("inbox");\n\n    /// <summary>Vault-relative template files explicitly configured through <c>template_folders</c>.</summary>\n    public IReadOnlyList<string> ConfiguredTemplateFiles =>\n        _data.TemplateFolders?.Values\n            .Where(value => !string.IsNullOrWhiteSpace(value))\n            .Distinct(StringComparer.OrdinalIgnoreCase)\n            .ToArray() ?? [];\n''')

          # audit_vault implementation and audit-specific classification helpers.
          path = Path("src/Kioku.Mcp.Server/Tools/VaultOrganizationTools.cs")
          text = path.read_text()
          start = text.index("    // audit_vault")
          end = text.index("    // process_inbox", start)
          audit_block = '''    // audit_vault\n\n    [McpServerTool, Description(\n        "Generates a health report of the vault: notes without tags, without dates, without content, " +\n        "missing/ambiguous/malformed wikilinks, recognized empty template placeholders, and stale notes. " +\n        "Wikilink findings preserve every occurrence, expose unique edge/target counts, and support " +\n        "bounded pagination via offset/limit.")]\n    public async Task<CallToolResult> audit_vault(\n        [Description("Flag notes not updated in this many days (default: 90).")] int stale_days = 90,\n        [Description("Number of findings to skip in each wikilink category (default: 0).")] int offset = 0,\n        [Description("Maximum findings to return per wikilink category (default: 50). The effective maximum preserves the legacy 50-item preview and honors larger KIOKU_MAX_RESULTS values.")]\n        int limit = 50)\n    {\n        if (offset < 0)\n        {\n            return CreateAuditError("'offset' must be 0 or greater.");\n        }\n\n        if (limit <= 0)\n        {\n            return CreateAuditError("'limit' must be greater than 0.");\n        }\n\n        var maxAuditResults = Math.Max(50, config.MaxSearchResults);\n        var cappedLimit = Math.Min(limit, maxAuditResults);\n        var generatedAt = DateTime.UtcNow;\n        var notes = vault.GetAllNotes().ToList();\n        var cutoff = generatedAt.AddDays(-stale_days);\n\n        var noTags = notes.Where(n => n.Metadata.Tags.Count == 0).ToList();\n        var noDates = notes.Where(n => !n.Metadata.Date.HasValue).ToList();\n        var emptyNotes = notes.Where(n => string.IsNullOrWhiteSpace(n.PlainText)).ToList();\n        var stale = notes.Where(n => n.LastModified < cutoff).ToList();\n\n        var templateSources = await DiscoverTemplateSourcesAsync();\n        var linkIssues = ScanLinkIssues(notes, templateSources);\n        var broken = CreateLinkAuditPage(linkIssues, LinkAuditStatus.Missing, offset, cappedLimit);\n        var ambiguous = CreateLinkAuditPage(linkIssues, LinkAuditStatus.Ambiguous, offset, cappedLimit);\n        var malformed = CreateLinkAuditPage(linkIssues, LinkAuditStatus.Malformed, offset, cappedLimit);\n        var templatePlaceholders = CreateLinkAuditPage(\n            linkIssues, LinkAuditStatus.TemplatePlaceholder, offset, cappedLimit);\n\n        var sb = new StringBuilder("# Kioku — Vault Audit Report\\n\\n");\n        sb.AppendLine(CultureInfo.InvariantCulture, $"**Generated:** {generatedAt:yyyy-MM-dd HH:mm} UTC");\n        sb.AppendLine(CultureInfo.InvariantCulture, $"**Total notes:** {notes.Count}\\n");\n\n        AppendSection(sb, $"Notes without tags ({noTags.Count})", noTags.Select(n => n.VaultRelativePath));\n        AppendSection(sb, $"Notes without date in frontmatter ({noDates.Count})", noDates.Select(n => n.VaultRelativePath));\n        AppendSection(sb, $"Empty notes ({emptyNotes.Count})", emptyNotes.Select(n => n.VaultRelativePath));\n        AppendLinkSection(sb, "Broken wikilinks", broken, issue => $"{issue.Note}: [[{issue.Link}]]");\n        AppendLinkSection(sb, "Ambiguous wikilinks", ambiguous, issue => $"{issue.Note}: [[{issue.Link}]]");\n        AppendLinkSection(sb, "Malformed wikilinks", malformed, issue => $"{issue.Note}: {issue.Link}");\n        AppendLinkSection(\n            sb,\n            "Template placeholders",\n            templatePlaceholders,\n            issue => $"{issue.Note}: empty wikilink/embed placeholder");\n        AppendSection(sb, $"Stale notes (not updated in {stale_days}+ days) ({stale.Count})",\n            stale.OrderBy(n => n.LastModified)\n                 .Select(n => $"{n.VaultRelativePath} (last modified: {n.LastModified:yyyy-MM-dd})"));\n\n        sb.AppendLine("\\n---");\n        sb.AppendLine(CultureInfo.InvariantCulture,\n            $"**Summary:** {noTags.Count} untagged · {emptyNotes.Count} empty · " +\n            $"{broken.TotalOccurrences} broken occurrences ({broken.UniqueEdges} unique edges, {broken.UniqueTargets} unique targets) · " +\n            $"{ambiguous.TotalOccurrences} ambiguous occurrences ({ambiguous.UniqueEdges} unique edges, {ambiguous.UniqueTargets} unique targets) · " +\n            $"{malformed.TotalOccurrences} malformed occurrences ({malformed.UniqueEdges} unique edges, {malformed.UniqueTargets} unique targets) · " +\n            $"{templatePlaceholders.TotalOccurrences} template placeholders skipped from malformed · " +\n            $"{stale.Count} stale");\n\n        var envelope = new\n        {\n            success = true,\n            data = new\n            {\n                generated_at_utc = generatedAt.ToString("O", CultureInfo.InvariantCulture),\n                total_notes = notes.Count,\n                stale_days,\n                counts = new\n                {\n                    notes_without_tags = noTags.Count,\n                    notes_without_date = noDates.Count,\n                    empty_notes = emptyNotes.Count,\n                    stale_notes = stale.Count,\n                    broken_occurrences = broken.TotalOccurrences,\n                    unique_broken_edges = broken.UniqueEdges,\n                    unique_broken_targets = broken.UniqueTargets,\n                    ambiguous_occurrences = ambiguous.TotalOccurrences,\n                    unique_ambiguous_edges = ambiguous.UniqueEdges,\n                    unique_ambiguous_targets = ambiguous.UniqueTargets,\n                    malformed_occurrences = malformed.TotalOccurrences,\n                    unique_malformed_edges = malformed.UniqueEdges,\n                    unique_malformed_targets = malformed.UniqueTargets,\n                    template_placeholder_occurrences = templatePlaceholders.TotalOccurrences,\n                    unique_template_placeholder_edges = templatePlaceholders.UniqueEdges,\n                    unique_template_placeholder_targets = templatePlaceholders.UniqueTargets,\n                },\n                links = new\n                {\n                    broken = ToStructuredLinkPage(broken),\n                    ambiguous = ToStructuredLinkPage(ambiguous),\n                    malformed = ToStructuredLinkPage(malformed),\n                    template_placeholders = ToStructuredLinkPage(templatePlaceholders),\n                },\n            },\n            error = (object?)null,\n            pagination = (object?)null,\n            warnings = Array.Empty<string>(),\n        };\n\n        return new CallToolResult\n        {\n            Content = [new TextContentBlock { Text = sb.ToString() }],\n            StructuredContent = JsonSerializer.SerializeToElement(envelope),\n            IsError = false,\n        };\n    }\n\n'''
          path.write_text(text[:start] + audit_block + text[end:])

          path = Path("src/Kioku.Mcp.Server/Tools/VaultOrganizationTools.cs")
          text = path.read_text()
          start = text.index("    private sealed record LinkIssue(")
          end = text.index("    private static CallToolResult CreateAuditError", start)
          helper_block = '''    private enum LinkAuditStatus\n    {\n        Missing,\n        Ambiguous,\n        Malformed,\n        TemplatePlaceholder,\n    }\n\n    private sealed record TemplateSourcePolicy(\n        IReadOnlySet<string> TemplateFiles,\n        IReadOnlyList<string> TemplateFolders);\n\n    private sealed record LinkIssue(\n        string Note,\n        string Link,\n        string Identity,\n        LinkAuditStatus Status,\n        string? Reason = null);\n\n    private sealed record LinkAuditPage(\n        int TotalOccurrences,\n        int UniqueEdges,\n        int UniqueTargets,\n        int Returned,\n        int Offset,\n        int Limit,\n        bool HasMore,\n        IReadOnlyList<LinkIssue> Findings);\n\n    private async Task<TemplateSourcePolicy> DiscoverTemplateSourcesAsync()\n    {\n        var templateFiles = new HashSet<string>(StringComparer.OrdinalIgnoreCase);\n        foreach (var configured in vaultConfig.ConfiguredTemplateFiles)\n        {\n            var normalized = NormalizeTemplateFileIdentity(configured);\n            if (normalized.Length > 0)\n            {\n                templateFiles.Add(normalized);\n            }\n        }\n\n        foreach (var pair in await TemplaterFolderTemplates.ReadAsync(config.VaultPath))\n        {\n            var normalized = NormalizeTemplateFileIdentity(pair.Template);\n            if (normalized.Length > 0)\n            {\n                templateFiles.Add(normalized);\n            }\n        }\n\n        var templateFolders = new HashSet<string>(StringComparer.OrdinalIgnoreCase);\n        var templaterRoot = await TemplaterFolderTemplates.ReadTemplatesFolderAsync(config.VaultPath);\n        if (!string.IsNullOrWhiteSpace(templaterRoot))\n        {\n            var normalized = NormalizeTemplateFolder(templaterRoot);\n            if (normalized.Length > 0)\n            {\n                templateFolders.Add(normalized);\n            }\n        }\n\n        return new TemplateSourcePolicy(\n            templateFiles,\n            templateFolders.OrderBy(folder => folder, StringComparer.OrdinalIgnoreCase).ToArray());\n    }\n\n    private List<LinkIssue> ScanLinkIssues(\n        IReadOnlyCollection<Note> notes,\n        TemplateSourcePolicy templateSources)\n    {\n        var issues = new List<LinkIssue>();\n        foreach (var note in notes)\n        {\n            foreach (var reference in MarkdownTextExtractor.ExtractWikilinkReferences(note.RawContent))\n            {\n                if (reference.IsMalformed)\n                {\n                    var isTemplatePlaceholder = IsRecognizedTemplatePlaceholder(\n                        note, reference, templateSources);\n                    issues.Add(new LinkIssue(\n                        note.VaultRelativePath,\n                        reference.Raw,\n                        NormalizeLinkIdentity(reference.Raw),\n                        isTemplatePlaceholder ? LinkAuditStatus.TemplatePlaceholder : LinkAuditStatus.Malformed,\n                        isTemplatePlaceholder ? "empty_target_in_template" : null));\n                    continue;\n                }\n\n                var resolution = vault.ResolveLinkResult(note, reference.Target);\n                if (resolution.Status == VaultLinkResolutionStatus.Resolved)\n                {\n                    continue;\n                }\n\n                issues.Add(new LinkIssue(\n                    note.VaultRelativePath,\n                    reference.Target,\n                    NormalizeLinkIdentity(resolution.Target),\n                    ToAuditStatus(resolution.Status)));\n            }\n        }\n\n        return issues;\n    }\n\n    private static bool IsRecognizedTemplatePlaceholder(\n        Note note,\n        MarkdownTextExtractor.WikilinkReference reference,\n        TemplateSourcePolicy templateSources)\n    {\n        // Only a closed, empty target is treated as scaffold syntax. Unclosed links and empty\n        // targets with aliases/raw payload remain malformed even inside a template.\n        if (!reference.IsMalformed ||\n            !string.IsNullOrWhiteSpace(reference.Target) ||\n            !string.IsNullOrWhiteSpace(reference.Raw))\n        {\n            return false;\n        }\n\n        var sourceFile = NormalizeTemplateFileIdentity(note.VaultRelativePath);\n        if (templateSources.TemplateFiles.Contains(sourceFile))\n        {\n            return true;\n        }\n\n        var sourcePath = NormalizeTemplatePath(note.VaultRelativePath);\n        return templateSources.TemplateFolders.Any(folder =>\n            sourcePath.StartsWith(folder + "/", StringComparison.OrdinalIgnoreCase));\n    }\n\n    private static string NormalizeTemplateFileIdentity(string path)\n    {\n        var normalized = NormalizeTemplatePath(path);\n        return normalized.EndsWith(".md", StringComparison.OrdinalIgnoreCase)\n            ? normalized[..^3]\n            : normalized;\n    }\n\n    private static string NormalizeTemplateFolder(string path) =>\n        NormalizeTemplatePath(path).TrimEnd('/');\n\n    private static string NormalizeTemplatePath(string path) =>\n        (path ?? string.Empty).Replace('\\\\', '/').Trim().Trim('/');\n\n    private static LinkAuditStatus ToAuditStatus(VaultLinkResolutionStatus status) => status switch\n    {\n        VaultLinkResolutionStatus.Missing => LinkAuditStatus.Missing,\n        VaultLinkResolutionStatus.Ambiguous => LinkAuditStatus.Ambiguous,\n        VaultLinkResolutionStatus.Malformed => LinkAuditStatus.Malformed,\n        _ => throw new InvalidOperationException($"Resolved links are not audit findings: {status}."),\n    };\n\n    private static LinkAuditPage CreateLinkAuditPage(\n        IEnumerable<LinkIssue> allIssues,\n        LinkAuditStatus status,\n        int offset,\n        int limit)\n    {\n        var issues = allIssues\n            .Where(issue => issue.Status == status)\n            .OrderBy(issue => issue.Note, StringComparer.OrdinalIgnoreCase)\n            .ThenBy(issue => issue.Identity, StringComparer.OrdinalIgnoreCase)\n            .ThenBy(issue => issue.Link, StringComparer.OrdinalIgnoreCase)\n            .ToList();\n\n        var uniqueEdges = issues\n            .Select(issue => $"{issue.Note}\\0{issue.Identity}")\n            .Distinct(StringComparer.OrdinalIgnoreCase)\n            .Count();\n        var uniqueTargets = issues\n            .Select(issue => issue.Identity)\n            .Distinct(StringComparer.OrdinalIgnoreCase)\n            .Count();\n        var findings = issues.Skip(offset).Take(limit).ToList();\n\n        return new LinkAuditPage(\n            issues.Count,\n            uniqueEdges,\n            uniqueTargets,\n            findings.Count,\n            offset,\n            limit,\n            offset + findings.Count < issues.Count,\n            findings);\n    }\n\n    private static string NormalizeLinkIdentity(string target)\n    {\n        var normalized = target.Replace('\\\\', '/').Trim();\n        return normalized.EndsWith(".md", StringComparison.OrdinalIgnoreCase)\n            ? normalized[..^3]\n            : normalized;\n    }\n\n    private static object ToStructuredLinkPage(LinkAuditPage page) => new\n    {\n        total_occurrences = page.TotalOccurrences,\n        unique_edges = page.UniqueEdges,\n        unique_targets = page.UniqueTargets,\n        returned = page.Returned,\n        offset = page.Offset,\n        limit = page.Limit,\n        has_more = page.HasMore,\n        findings = page.Findings.Select(issue => new\n        {\n            source = issue.Note,\n            target = issue.Link,\n            target_identity = issue.Identity,\n            status = FormatAuditStatus(issue.Status),\n            reason = issue.Reason,\n        }),\n    };\n\n    private static string FormatAuditStatus(LinkAuditStatus status) => status switch\n    {\n        LinkAuditStatus.Missing => "missing",\n        LinkAuditStatus.Ambiguous => "ambiguous",\n        LinkAuditStatus.Malformed => "malformed",\n        LinkAuditStatus.TemplatePlaceholder => "template_placeholder",\n        _ => throw new ArgumentOutOfRangeException(nameof(status), status, null),\n    };\n\n    private static void AppendLinkSection(\n        StringBuilder sb,\n        string title,\n        LinkAuditPage page,\n        Func<LinkIssue, string> format)\n    {\n        sb.AppendLine(CultureInfo.InvariantCulture, $"## {title} ({page.TotalOccurrences})");\n        sb.AppendLine(CultureInfo.InvariantCulture,\n            $"_unique edges: {page.UniqueEdges} · unique targets: {page.UniqueTargets} · " +\n            $"returned: {page.Returned} · offset: {page.Offset} · limit: {page.Limit} · " +\n            $"has_more: {page.HasMore.ToString().ToLowerInvariant()}_");\n\n        if (page.TotalOccurrences == 0)\n        {\n            sb.AppendLine("_(none)_");\n        }\n        else if (page.Findings.Count == 0)\n        {\n            sb.AppendLine("_(requested page is empty)_");\n        }\n        else\n        {\n            foreach (var issue in page.Findings)\n            {\n                sb.AppendLine(CultureInfo.InvariantCulture, $"- {format(issue)}");\n            }\n\n            if (page.HasMore)\n            {\n                sb.AppendLine(CultureInfo.InvariantCulture,\n                    $"- _(... and {page.TotalOccurrences - page.Offset - page.Returned} more)_");\n            }\n        }\n\n        sb.AppendLine();\n    }\n\n'''
          path.write_text(text[:start] + helper_block + text[end:])

          # Templater tests for the root folder setting.
          path = Path("src/Kioku.Mcp.Server.Tests/TemplaterFolderTemplatesTests.cs")
          text = path.read_text()
          marker = "    // RegisterFolderTemplatesAsync\n"
          tests = '''    [Fact]\n    public async Task ReadTemplatesFolderAsync_NoDataJson_ReturnsNull()\n    {\n        var result = await TemplaterFolderTemplates.ReadTemplatesFolderAsync(_vaultPath);\n\n        Assert.Null(result);\n    }\n\n    [Fact]\n    public async Task ReadTemplatesFolderAsync_ReturnsRootEvenWhenFolderTemplatesDisabled()\n    {\n        WriteTemplaterSettings(\"\"\"\n            { \"templates_folder\": \"99-system/templates\", \"enable_folder_templates\": false, \"folder_templates\": [] }\n            \"\"\");\n\n        var result = await TemplaterFolderTemplates.ReadTemplatesFolderAsync(_vaultPath);\n\n        Assert.Equal("99-system/templates", result);\n    }\n\n    [Theory]\n    [InlineData("{ \\\"templates_folder\\\": \\\"   \\\" }")]\n    [InlineData("{ not valid json")]\n    public async Task ReadTemplatesFolderAsync_BlankOrMalformed_ReturnsNull(string json)\n    {\n        WriteTemplaterSettings(json);\n\n        var result = await TemplaterFolderTemplates.ReadTemplatesFolderAsync(_vaultPath);\n\n        Assert.Null(result);\n    }\n\n'''
          if marker not in text:
              raise SystemExit("Templater tests marker not found")
          path.write_text(text.replace(marker, tests + marker, 1))

          # Audit regression coverage.
          path = Path("src/Kioku.Mcp.Server.Tests/VaultOrganizationToolsAuditPaginationTests.cs")
          text = path.read_text()
          text = text.replace(
              'foreach (var category in new[] { "broken", "ambiguous", "malformed" })',
              'foreach (var category in new[] { "broken", "ambiguous", "malformed", "template_placeholders" })')
          marker = "    [Theory]\n    [InlineData(-1, 50, \"'offset' must be 0 or greater.\")]"
          tests = '''    [Fact]\n    public async Task AuditVault_Classifies_empty_links_in_templater_root_as_template_placeholders()\n    {\n        await using var harness = await AuditHarness.CreateAsync(\n            (".obsidian/plugins/templater-obsidian/data.json",\n                "{\\\"templates_folder\\\":\\\"Templates\\\",\\\"enable_folder_templates\\\":false,\\\"folder_templates\\\":[]}"),\n            ("Templates/template.md", "- [[]]\\n- ![[]]"));\n\n        var result = await harness.Tools.audit_vault();\n        var data = Data(result);\n        var counts = data.GetProperty("counts");\n        var placeholders = data.GetProperty("links").GetProperty("template_placeholders");\n\n        Assert.Equal(0, counts.GetProperty("malformed_occurrences").GetInt32());\n        Assert.Equal(2, counts.GetProperty("template_placeholder_occurrences").GetInt32());\n        Assert.Equal(1, counts.GetProperty("unique_template_placeholder_edges").GetInt32());\n        Assert.Equal(1, counts.GetProperty("unique_template_placeholder_targets").GetInt32());\n        Assert.Equal(2, placeholders.GetProperty("total_occurrences").GetInt32());\n        Assert.All(\n            placeholders.GetProperty("findings").EnumerateArray(),\n            finding =>\n            {\n                Assert.Equal("template_placeholder", finding.GetProperty("status").GetString());\n                Assert.Equal("empty_target_in_template", finding.GetProperty("reason").GetString());\n            });\n        Assert.Contains("## Template placeholders (2)", Text(result));\n    }\n\n    [Fact]\n    public async Task AuditVault_Real_malformed_link_inside_template_remains_malformed()\n    {\n        await using var harness = await AuditHarness.CreateAsync(\n            (".obsidian/plugins/templater-obsidian/data.json",\n                "{\\\"templates_folder\\\":\\\"Templates\\\",\\\"enable_folder_templates\\\":false,\\\"folder_templates\\\":[]}"),\n            ("Templates/template.md", "- [[]]\\n- [[unclosed"));\n\n        var result = await harness.Tools.audit_vault();\n        var counts = Data(result).GetProperty("counts");\n\n        Assert.Equal(1, counts.GetProperty("template_placeholder_occurrences").GetInt32());\n        Assert.Equal(1, counts.GetProperty("malformed_occurrences").GetInt32());\n    }\n\n    [Fact]\n    public async Task AuditVault_Empty_link_outside_template_remains_malformed()\n    {\n        await using var harness = await AuditHarness.CreateAsync(("Live.md", "[[]]"));\n\n        var result = await harness.Tools.audit_vault();\n        var counts = Data(result).GetProperty("counts");\n\n        Assert.Equal(0, counts.GetProperty("template_placeholder_occurrences").GetInt32());\n        Assert.Equal(1, counts.GetProperty("malformed_occurrences").GetInt32());\n    }\n\n    [Fact]\n    public async Task AuditVault_Kioku_configured_template_file_is_recognized_without_templater()\n    {\n        await using var harness = await AuditHarness.CreateAsync(\n            (".kioku/config.yml", "template_folders:\\n  \\\"Projects\\\": \\\"Scaffolds/project.md\\\"\\n"),\n            ("Scaffolds/project.md", "[[]]"));\n\n        var result = await harness.Tools.audit_vault();\n        var counts = Data(result).GetProperty("counts");\n\n        Assert.Equal(1, counts.GetProperty("template_placeholder_occurrences").GetInt32());\n        Assert.Equal(0, counts.GetProperty("malformed_occurrences").GetInt32());\n    }\n\n    [Fact]\n    public async Task AuditVault_Vault_boundary_traversal_remains_malformed()\n    {\n        await using var harness = await AuditHarness.CreateAsync(("Folder/Live.md", "[[../../Outside]]"));\n\n        var result = await harness.Tools.audit_vault();\n\n        Assert.Equal(1, Data(result).GetProperty("counts").GetProperty("malformed_occurrences").GetInt32());\n        Assert.Equal(0, Data(result).GetProperty("counts").GetProperty("template_placeholder_occurrences").GetInt32());\n    }\n\n    [Fact]\n    public async Task AuditVault_Trailing_hash_without_literal_note_remains_malformed()\n    {\n        await using var harness = await AuditHarness.CreateAsync(("Source.md", "[[C#]]"));\n\n        var result = await harness.Tools.audit_vault();\n        var malformed = Data(result).GetProperty("links").GetProperty("malformed");\n\n        Assert.Equal(1, malformed.GetProperty("total_occurrences").GetInt32());\n        Assert.Equal("C#", malformed.GetProperty("findings")[0].GetProperty("target").GetString());\n        Assert.Equal("C", malformed.GetProperty("findings")[0].GetProperty("target_identity").GetString());\n    }\n\n    [Fact]\n    public async Task AuditVault_Literal_hash_filename_still_resolves_before_fragment_fallback()\n    {\n        await using var harness = await AuditHarness.CreateAsync(\n            ("Source.md", "[[C#]]"),\n            ("C#.md", "# C sharp"));\n\n        var result = await harness.Tools.audit_vault();\n        var counts = Data(result).GetProperty("counts");\n\n        Assert.Equal(0, counts.GetProperty("broken_occurrences").GetInt32());\n        Assert.Equal(0, counts.GetProperty("malformed_occurrences").GetInt32());\n    }\n\n'''
          if marker not in text:
              raise SystemExit("Audit tests marker not found")
          path.write_text(text.replace(marker, tests + marker, 1))

          # Smoke contract: require the new category and a real placeholder fixture.
          replace_once(
              "scripts/Kioku.Ci/Program.cs",
              '''        _ = counts.GetProperty("unique_broken_targets").GetInt32();\n\n        foreach (var category in new[] { "broken", "ambiguous", "malformed" })''',
              '''        _ = counts.GetProperty("unique_broken_targets").GetInt32();\n        var templatePlaceholderOccurrences = counts.GetProperty("template_placeholder_occurrences").GetInt32();\n        if (templatePlaceholderOccurrences < 1)\n        {\n            throw new InvalidOperationException("audit_vault did not classify the smoke template placeholder.");\n        }\n\n        foreach (var category in new[] { "broken", "ambiguous", "malformed", "template_placeholders" })''')

          path = Path(".github/workflows/ci.yml")
          text = path.read_text()
          seed = '''          printf '# Seed\\n\\nPackage smoke fixture.\\n' > "$VAULT/seed.md"\n          mkdir -p "$VAULT/.kioku"\n'''
          seeded = '''          printf '# Seed\\n\\nPackage smoke fixture.\\n' > "$VAULT/seed.md"\n          mkdir -p "$VAULT/Templates" "$VAULT/.obsidian/plugins/templater-obsidian"\n          printf '%s\\n' '{"templates_folder":"Templates","enable_folder_templates":false,"folder_templates":[]}' > "$VAULT/.obsidian/plugins/templater-obsidian/data.json"\n          printf '%s\\n' '- [[]]' > "$VAULT/Templates/template-smoke.md"\n          mkdir -p "$VAULT/.kioku"\n'''
          if seed not in text:
              raise SystemExit("stdio smoke seed marker not found")
          text = text.replace(seed, seeded, 1)
          http_seed = '''          printf '# Seed\\n\\nHTTP smoke fixture.\\n' > "$VAULT/seed.md"\n          mkdir -p "$VAULT/.kioku"\n'''
          http_seeded = '''          printf '# Seed\\n\\nHTTP smoke fixture.\\n' > "$VAULT/seed.md"\n          mkdir -p "$VAULT/Templates" "$VAULT/.obsidian/plugins/templater-obsidian"\n          printf '%s\\n' '{"templates_folder":"Templates","enable_folder_templates":false,"folder_templates":[]}' > "$VAULT/.obsidian/plugins/templater-obsidian/data.json"\n          printf '%s\\n' '- [[]]' > "$VAULT/Templates/template-smoke.md"\n          mkdir -p "$VAULT/.kioku"\n'''
          if http_seed not in text:
              raise SystemExit("HTTP smoke seed marker not found")
          path.write_text(text.replace(http_seed, http_seeded, 1))

          # Maintained docs explain the bounded recognition policy.
          replace_once(
              "docs/vault-config.md",
              '- `template_folders` maps destination folders to vault-relative Markdown templates.\n',
              '''- `template_folders` maps destination folders to vault-relative Markdown templates.\n\n`audit_vault` recognizes a closed empty wikilink/embed (`[[]]` or `![[]]`) as a template placeholder only when the source is an explicitly known template: a `template_folders` value, a Templater folder-template file, or a file under Templater's configured `templates_folder`. These occurrences are reported separately from live malformed links. Non-empty malformed links inside templates, empty links outside recognized templates, and vault-boundary traversal remain malformed.\n''')
          PY

      - name: Restore
        run: dotnet restore Kioku.slnx

      - name: Build
        run: dotnet build Kioku.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj --configuration Release --no-restore --verbosity minimal

      - name: Format
        run: |
          dotnet format Kioku.slnx whitespace --verify-no-changes --no-restore
          dotnet format Kioku.slnx style --verify-no-changes --no-restore

      - name: Generate and validate public docs
        run: |
          node scripts/generate-public-docs.mjs --write
          node scripts/generate-public-docs.mjs --check
          node scripts/validate-markdown-links.mjs
          node scripts/validate-docs-navigation.mjs
          node scripts/validate-release-documentation.mjs
          node scripts/validate-portable-configs.mjs

      - name: Commit implementation
        shell: bash
        run: |
          set -euo pipefail
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add . ':!.github/workflows/tmp-issue-402.yml'
          git diff --cached --check
          if git diff --cached --quiet; then
            echo "No implementation changes to commit"
            exit 1
          fi
          git commit -m "fix(audit): classify empty template placeholders"
          git push origin HEAD:fix/audit-template-placeholders-402
