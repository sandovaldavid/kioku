name: prepare-bridge-source-artifact

on:
  pull_request:
    branches: [develop]

jobs:
  prepare:
    if: github.head_ref == 'agent/harden-obsidian-bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Apply exact protocol fixture fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          bridge_test = Path('src/obsidian-kioku-mcp/src/bridge.test.ts')
          text = bridge_test.read_text(encoding='utf-8')
          text = text.replace('  MAX_MESSAGE_BYTES,\n', '')
          marker = 'import { DEFAULT_SETTINGS, PROTOCOL_VERSION } from "./types";\n'
          addition = 'import { MAX_MESSAGE_BYTES } from "./protocol";\n'
          if addition not in text:
              if marker not in text:
                  raise SystemExit('bridge.test import marker missing')
              text = text.replace(marker, addition + marker, 1)
          bridge_test.write_text(text, encoding='utf-8')

          for path in Path('src/Kioku.Mcp.Server.Tests').glob('*.cs'):
              content = path.read_text(encoding='utf-8')
              updated = content.replace('PROTOCOL_VERSION 2', 'PROTOCOL_VERSION 3')
              updated = updated.replace('protocolVersion = 2', 'protocolVersion = 3')
              updated = updated.replace(
                  'Assert.Equal(2, message.GetProperty("protocolVersion").GetInt32());',
                  'Assert.Equal(3, message.GetProperty("protocolVersion").GetInt32());')
              if updated != content:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format plugin
        run: pnpm --filter obsidian-kioku-mcp run format

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Restore .NET tests
        run: dotnet restore src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj

      - name: Format .NET
        run: dotnet format src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj --no-restore --verbosity minimal

      - name: Collect formatted source
        run: |
          mkdir -p prepared/src/obsidian-kioku-mcp
          mkdir -p prepared/src/Kioku.Mcp.Server/Services
          mkdir -p prepared/src/Kioku.Mcp.Server.Tests
          cp -R src/obsidian-kioku-mcp/src prepared/src/obsidian-kioku-mcp/
          cp src/Kioku.Mcp.Server/Services/ObsidianBridgeService.cs prepared/src/Kioku.Mcp.Server/Services/
          cp src/Kioku.Mcp.Server.Tests/ObsidianBridgeServiceTests.cs prepared/src/Kioku.Mcp.Server.Tests/
          cp src/Kioku.Mcp.Server.Tests/TemplaterInteropTests.cs prepared/src/Kioku.Mcp.Server.Tests/
          cp src/Kioku.Mcp.Server.Tests/PluginIntegrationToolsTests.cs prepared/src/Kioku.Mcp.Server.Tests/
          git diff -- src/obsidian-kioku-mcp/src src/Kioku.Mcp.Server src/Kioku.Mcp.Server.Tests > prepared/formatted.patch

      - name: Upload formatted source
        uses: actions/upload-artifact@v6
        with:
          name: prepared-bridge-source
          path: prepared
          if-no-files-found: error
          retention-days: 1
