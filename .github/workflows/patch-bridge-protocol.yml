name: prepare-bridge-source-commit

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'agent/harden-obsidian-bridge' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply exact protocol fixture fixes
        run: |
          python - <<'PY'
          from pathlib import Path

          bridge_test = Path('src/obsidian-kioku-mcp/src/bridge.test.ts')
          text = bridge_test.read_text(encoding='utf-8')
          text = text.replace('  MAX_MESSAGE_BYTES,\n', '')
          marker = 'import { DEFAULT_SETTINGS, PROTOCOL_VERSION } from "./types";\n'
          addition = 'import { MAX_MESSAGE_BYTES } from "./protocol";\n'
          if addition not in text:
              if marker not in text:
                  raise SystemExit('bridge.test import marker missing')
              text = text.replace(marker, addition + marker, 1)
          bridge_test.write_text(text, encoding='utf-8')

          for path in Path('src/Kioku.Mcp.Server.Tests').glob('*.cs'):
              content = path.read_text(encoding='utf-8')
              updated = content.replace('PROTOCOL_VERSION 2', 'PROTOCOL_VERSION 3')
              updated = updated.replace('protocolVersion = 2', 'protocolVersion = 3')
              updated = updated.replace(
                  'Assert.Equal(2, message.GetProperty("protocolVersion").GetInt32());',
                  'Assert.Equal(3, message.GetProperty("protocolVersion").GetInt32());')
              if updated != content:
                  path.write_text(updated, encoding='utf-8')
          PY

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format plugin
        run: pnpm --filter obsidian-kioku-mcp run format

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Restore .NET tests
        run: dotnet restore src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj

      - name: Format .NET
        run: dotnet format src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj --no-restore --verbosity minimal

      - name: Create staged commit
        id: create_commit
        shell: bash
        run: |
          set +e
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config commit.gpgsign false
          git add src/obsidian-kioku-mcp/src src/Kioku.Mcp.Server src/Kioku.Mcp.Server.Tests
          if git diff --cached --quiet; then
            git rev-parse HEAD > staged-commit-sha.txt
            commit_status=0
          else
            git -c commit.gpgsign=false commit --no-verify -m "test(bridge): align protocol v3 fixtures and formatting" > staged-commit-output.txt 2>&1
            commit_status=$?
            if [ "$commit_status" -eq 0 ]; then
              git rev-parse HEAD > staged-commit-sha.txt
            else
              git status --short > staged-status.txt
              git diff --cached --stat > staged-diff-stat.txt
              git rev-parse HEAD > staged-commit-sha.txt
            fi
          fi
          git rev-parse HEAD^{tree} > staged-tree-sha.txt
          git show --stat --oneline HEAD > staged-commit-summary.txt
          echo "commit_status=$commit_status" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Create bundle
        if: steps.create_commit.outputs.commit_status == '0'
        run: git bundle create staged-bridge-commit.bundle HEAD

      - name: Attempt staging push
        if: steps.create_commit.outputs.commit_status == '0'
        continue-on-error: true
        run: git push --force-with-lease origin HEAD:automation/harden-obsidian-bridge-formatted

      - name: Upload staged commit and diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: staged-bridge-commit
          path: |
            staged-commit-sha.txt
            staged-tree-sha.txt
            staged-commit-summary.txt
            staged-bridge-commit.bundle
            staged-commit-output.txt
            staged-status.txt
            staged-diff-stat.txt
          if-no-files-found: warn
          retention-days: 1

      - name: Fail when commit creation failed
        if: steps.create_commit.outputs.commit_status != '0'
        run: exit 1
