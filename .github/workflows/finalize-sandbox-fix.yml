name: finalize-sandbox-fix

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  finalize:
    if: github.head_ref == 'agent/enforce-filesystem-sandbox' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Preserve legacy error wording
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/Kioku.Mcp.Server/Services/NoteHelpers.cs')
          text = path.read_text(encoding='utf-8')
          old = '            throw new InvalidOperationException(exception.Message, exception);'
          new = '            throw new InvalidOperationException("The requested path escapes the vault security boundary.", exception);'
          if text.count(old) != 1:
              raise SystemExit(f'Expected one legacy exception translation, found {text.count(old)}')
          path.write_text(text.replace(old, new), encoding='utf-8')
          PY

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj

      - name: Apply formatter
        run: dotnet format src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj --no-restore --verbosity minimal

      - name: Commit compatibility and formatting
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Kioku.Mcp.Server src/Kioku.Mcp.Server.Tests
          git commit -m "fix: preserve sandbox compatibility contracts"
          git push origin HEAD:${{ github.head_ref }}