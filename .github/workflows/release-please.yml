name: release-please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}

    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          target-branch: main
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  build-server:
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    strategy:
      fail-fast: false
      matrix:
        include:
          - rid: win-x64
            artifact-name: kioku-server-win-x64.exe
            binary: Kioku.Mcp.Server.exe
          - rid: linux-x64
            artifact-name: kioku-server-linux-x64
            binary: Kioku.Mcp.Server
          - rid: osx-x64
            artifact-name: kioku-server-osx-x64
            binary: Kioku.Mcp.Server
          - rid: osx-arm64
            artifact-name: kioku-server-osx-arm64
            binary: Kioku.Mcp.Server

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Publish (${{ matrix.rid }})
        run: |
          dotnet publish src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj \
            --runtime ${{ matrix.rid }} \
            --configuration Release \
            --self-contained \
            --output publish/${{ matrix.rid }}

      - name: Rename artifact
        run: mv publish/${{ matrix.rid }}/${{ matrix.binary }} ${{ matrix.artifact-name }}

      # Keep release SBOM generation fail-closed without depending on an action that
      # downloads Syft dynamically on every matrix leg. The immutable upstream archive
      # is pinned to the digest published by the Syft v1.42.3 GitHub release.
      - name: Install pinned Syft
        shell: bash
        env:
          SYFT_VERSION: "1.42.3"
          SYFT_SHA256: "0d6be741479eddd2c8644a288990c04f3df0d609bbc1599a005532a9dff63509"
        run: |
          set -euo pipefail

          archive="$RUNNER_TEMP/syft_${SYFT_VERSION}_linux_amd64.tar.gz"
          tool_dir="$RUNNER_TEMP/kioku-release-tools"
          url="https://github.com/anchore/syft/releases/download/v${SYFT_VERSION}/syft_${SYFT_VERSION}_linux_amd64.tar.gz"

          mkdir -p "$tool_dir"
          curl \
            --fail \
            --location \
            --silent \
            --show-error \
            --retry 5 \
            --retry-delay 2 \
            --retry-all-errors \
            --connect-timeout 15 \
            --max-time 180 \
            --output "$archive" \
            "$url"

          printf '%s  %s\n' "$SYFT_SHA256" "$archive" | sha256sum --check -
          tar -xzf "$archive" -C "$tool_dir" syft
          chmod +x "$tool_dir/syft"
          "$tool_dir/syft" version
          echo "$tool_dir" >> "$GITHUB_PATH"

      - name: Generate SBOM
        shell: bash
        run: |
          set -euo pipefail
          syft scan "dir:publish/${{ matrix.rid }}" \
            --output "spdx-json=${{ matrix.artifact-name }}.spdx.json"
          test -s "${{ matrix.artifact-name }}.spdx.json"

      - name: Install cosign
        uses: sigstore/cosign-installer@v4.1.2

      - name: Sign binary and SBOM
        env:
          COSIGN_EXPERIMENTAL: 1
        run: |
          cosign sign-blob --yes \
            --output-signature ${{ matrix.artifact-name }}.sig \
            --output-certificate ${{ matrix.artifact-name }}.pem \
            ${{ matrix.artifact-name }}
          cosign sign-blob --yes \
            --output-signature ${{ matrix.artifact-name }}.spdx.json.sig \
            --output-certificate ${{ matrix.artifact-name }}.spdx.json.pem \
            ${{ matrix.artifact-name }}.spdx.json

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact-name }}
          path: |
            ${{ matrix.artifact-name }}
            ${{ matrix.artifact-name }}.sig
            ${{ matrix.artifact-name }}.pem
            ${{ matrix.artifact-name }}.spdx.json
            ${{ matrix.artifact-name }}.spdx.json.sig
            ${{ matrix.artifact-name }}.spdx.json.pem

  attach-artifacts:
    needs: [release-please, build-server]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/download-artifact@v8
        with:
          path: artifacts/

      - name: Upload artifacts to release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "${{ needs.release-please.outputs.tag_name }}" \
            artifacts/*/*

  publish-nuget:
    needs: [release-please, attach-artifacts]
    if: ${{ needs.release-please.outputs.release_created }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      # Package as a self-contained, multi-RID .NET tool package.
      # Under .NET 10, the SDK automatically restores, builds, and packs separate NuGet
      # packages for each RuntimeIdentifier defined in the project, plus an umbrella package.
      - name: Restore dependencies
        run: dotnet restore src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj

      - name: Pack NuGet package
        run: |
          dotnet pack src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj \
            --configuration Release \
            --no-restore \
            --output ./nupkg

      # Trusted Publishing: exchanges this job's OIDC token for a NuGet.org API key
      # that's valid for 1 hour, so no long-lived NUGET_API_KEY secret is needed.
      - name: NuGet login (OIDC -> temp API key)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet.org
        run: |
          dotnet nuget push ./nupkg/*.nupkg \
            --api-key "${{ steps.login.outputs.NUGET_API_KEY }}" \
            --source https://api.nuget.org/v3/index.json \
            --skip-duplicate
