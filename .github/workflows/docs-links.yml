name: docs-links

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate-markdown-links:
    name: validate-markdown-links (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Validate repository-relative Markdown links
        run: node scripts/validate-markdown-links.mjs

      - name: Validate documentation sidebar contract
        run: node scripts/validate-docs-navigation.mjs
