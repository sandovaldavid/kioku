name: dependency-review

# GitHub's dependency-review API compares revisions on the default branch. Kioku feature
# work targets develop, so dependency review is enforced on the release PR into main;
# develop PRs remain blocked by dotnet vulnerability scanning and pnpm audit in ci.yml.
on:
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  dependency-review:
    name: dependency-review
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          comment-summary-in-pr: on-failure
