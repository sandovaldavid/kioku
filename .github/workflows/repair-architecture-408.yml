name: repair-architecture-408

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
      - name: Apply source and contract-test repairs
        shell: python
        run: |
          from pathlib import Path

          def read(path):
              return Path(path).read_text(encoding='utf-8')

          def write(path, text):
              Path(path).write_text(text, encoding='utf-8', newline='\n')

          def replace_once(text, old, new, label):
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{label}: expected exactly one match, found {count}')
              return text.replace(old, new, 1)

          # Keep EngineeringWorkflowTools as a one-port MCP adapter.
          path = 'src/Kioku.Mcp.Server/Tools/EngineeringWorkflowTools.cs'
          text = read(path)
          old = '''    private readonly IProjectDocumentService _documents;
              private readonly EngineeringSpecService? _specs;

              public EngineeringWorkflowTools(IProjectDocumentService documents)
              {
                  _documents = documents;
              }

              public EngineeringWorkflowTools(
                  IProjectDocumentService documents,
                  ProjectWorkspaceService workspace,
                  VaultConfigService vaultConfig,
                  VaultIndexService vault,
                  ObsidianBridgeService bridge,
                  IVaultMutationService mutations)
              {
                  _documents = documents;
                  _specs = new EngineeringSpecService(workspace, vaultConfig, vault, bridge, mutations);
              }
          '''.replace('              ', '    ')
          new = '''    private readonly IProjectDocumentService _documents;

              public EngineeringWorkflowTools(IProjectDocumentService documents)
              {
                  _documents = documents;
              }
          '''.replace('              ', '    ')
          text = replace_once(text, old, new, 'EngineeringWorkflowTools constructor')
          start_marker = '''    [McpServerTool, Description(
                  "Returns the current state of a project workspace: the project MOC note, summaries of " +'''.replace('                  ', '        ')
          end_marker = '''    [McpServerTool, Description(
                  "Lists all project workspaces under the projects root with per-type document counts " +'''.replace('                  ', '        ')
          start = text.index(start_marker)
          end = text.index(end_marker, start)
          replacement = '''    [McpServerTool, Description(
                  "Returns the current state of a project workspace: the project MOC note, summaries of " +
                  "recent work sessions, and per-type listings (decisions, bugs, specs, plans, tickets, backlog, " +
                  "knowledge, daily). Reads fresh from disk. Approved specs are current requirements; draft " +
                  "specs are in progress; superseded/discarded specs are explicitly historical.")]
              public Task<string> get_project_context(
                  [Description("Project name (folder under the projects root). Use list_projects to discover names.")] string project,
                  [Description("Include the full content of every listed document (verbose).")] bool include_content = false,
                  [Description("Comma-separated type filter (adr, decision(s), bug(s), spec(s), plan(s), ticket(s), idea/backlog, knowledge, session(s), daily). Empty = all.")] string types = "",
                  [Description("Maximum documents listed per type.")] int limit = 20,
                  CancellationToken cancellationToken = default) =>
                  _documents.GetProjectContextAsync(project, include_content, types, limit, cancellationToken);

          '''.replace('              ', '    ')
          text = text[:start] + replacement + text[end:]
          tail = '''
              private static bool IsSpecAlias(string value) =>
                  value.Equals("spec", StringComparison.OrdinalIgnoreCase) ||
                  value.Equals("specs", StringComparison.OrdinalIgnoreCase);
          '''.replace('              ', '    ')
          text = replace_once(text, tail, '\n', 'EngineeringWorkflowTools IsSpecAlias')
          write(path, text)

          # Route focused spec creation through the same application port.
          path = 'src/Kioku.Mcp.Server/Tools/FocusedCreationTools.cs'
          text = read(path)
          text = replace_once(
              text,
              '''    IProjectDocumentService documents,
              IVaultMutationService mutations,
              ProjectWorkspaceService? workspace = null)
          {
              private readonly ProjectWorkspaceService _workspace =
                  workspace ?? new ProjectWorkspaceService(config, vaultConfig, bridge, mutations);

              private readonly EngineeringWorkflowTools _engineering = new(documents);

              private readonly EngineeringSpecService _specs = new(
                  workspace ?? new ProjectWorkspaceService(config, vaultConfig, bridge, mutations),
                  vaultConfig,
                  vault,
                  bridge,
                  mutations);
          '''.replace('              ', '    '),
              '''    IProjectDocumentService documents,
              IVaultMutationService mutations)
          {
              private readonly EngineeringWorkflowTools _engineering = new(documents);
          '''.replace('              ', '    '),
              'FocusedCreationTools constructor')
          text = replace_once(text, '_specs.CreateSpecAsync(', 'documents.CreateSpecAsync(', 'focused spec call')
          text = replace_once(text, '_specs.CreatePlanFromSpecAsync(', 'documents.CreatePlanFromSpecAsync(', 'focused plan-spec call')
          write(path, text)

          # Make ProjectDocumentService the spec-aware application workflow while retaining its existing port.
          path = 'src/Kioku.Mcp.Server/Services/ProjectDocumentService.cs'
          text = read(path)
          text = replace_once(
              text,
              '/// (ADRs), bug logs, implementation plans, knowledge notes, backlog ideas, project context\n',
              '/// (ADRs), bug logs, specifications, implementation plans, knowledge notes, backlog ideas, project context\n',
              'ProjectDocumentService summary')
          text = replace_once(
              text,
              '        ["bugs"] = "bugs",\n        ["plan"] = "plans",',
              '        ["bugs"] = "bugs",\n        ["spec"] = "specs",\n        ["specs"] = "specs",\n        ["plan"] = "plans",',
              'spec type aliases')
          text = replace_once(
              text,
              '    private readonly IVaultMutationService? _mutations;\n',
              '    private readonly IVaultMutationService? _mutations;\n    private readonly EngineeringSpecService _specs;\n',
              'spec service field')
          text = replace_once(
              text,
              '        _fileSystem = fileSystem;\n        _mutations = mutations;\n',
              '        _fileSystem = fileSystem;\n        _mutations = mutations;\n        _specs = new EngineeringSpecService(workspace, vaultConfig, vault, bridge, mutations!);\n',
              'spec service initialization')
          insertion = '''
              public Task<string> CreateSpecAsync(
                  string project,
                  string title,
                  string objective,
                  string requirements,
                  string status = "draft",
                  string sourceIssue = "",
                  string tags = "",
                  string context = "",
                  string nonGoals = "",
                  string architecture = "",
                  string components = "",
                  string dataFlow = "",
                  string errorHandling = "",
                  string securityPrivacy = "",
                  string compatibility = "",
                  string testingStrategy = "",
                  string decisions = "",
                  string openQuestions = "",
                  string related = "",
                  VaultMutationPreconditions? preconditions = null,
                  CancellationToken cancellationToken = default)
              {
                  if (_mutations is null)
                  {
                      return Task.FromResult("[error] First-class spec creation requires the configured vault mutation boundary.");
                  }

                  return _specs.CreateSpecAsync(
                      project, title, objective, requirements, status, sourceIssue, tags, context, nonGoals,
                      architecture, components, dataFlow, errorHandling, securityPrivacy, compatibility,
                      testingStrategy, decisions, openQuestions, related, preconditions, cancellationToken);
              }

              public Task<string> CreatePlanFromSpecAsync(
                  string project,
                  string title,
                  string objective,
                  string steps,
                  string spec,
                  string status = "draft",
                  string ticket = "",
                  string tags = "",
                  VaultMutationPreconditions? preconditions = null,
                  CancellationToken cancellationToken = default)
              {
                  if (_mutations is null)
                  {
                      return Task.FromResult("[error] Spec-linked plan creation requires the configured vault mutation boundary.");
                  }

                  return _specs.CreatePlanFromSpecAsync(
                      project, title, objective, steps, spec, status, ticket, tags, preconditions, cancellationToken);
              }

          '''.replace('              ', '    ')
          text = replace_once(text, '    public Task<string> AddKnowledgeAsync(\n', insertion + '    public Task<string> AddKnowledgeAsync(\n', 'spec application methods')
          specs_context = '''
              if (typeFilter.Contains("specs"))
              {
                  var specsSection = await _specs.BuildSpecsSectionAsync(project, includeContent, limit, cancellationToken);
                  if (specsSection.StartsWith("[error]", StringComparison.OrdinalIgnoreCase))
                  {
                      return specsSection;
                  }

                  sb.AppendLine(specsSection);
                  sb.AppendLine();
              }

          '''.replace('              ', '    ')
          text = replace_once(text, '        var sections = new (string Key, string Heading)[]\n', specs_context + '        var sections = new (string Key, string Heading)[]\n', 'spec context section')
          text = replace_once(
              text,
              '            #     bugs: "bugs"\n            #     plans: "plans"',
              '            #     bugs: "bugs"\n            #     specs: "specs"\n            #     plans: "plans"',
              'setup config specs reference')
          write(path, text)

          # Public tool-count baselines intentionally move by exactly one.
          path = 'src/Kioku.Mcp.Server.Tests/McpSurfaceMetadataContractTests.cs'
          text = read(path)
          text = text.replace('Default_profile_exposes_44_tools_', 'Default_profile_exposes_45_tools_')
          text = text.replace('All_capabilities_profile_exposes_77_tools_', 'All_capabilities_profile_exposes_78_tools_')
          text = text.replace('Assert.Equal(44, tools.Count);', 'Assert.Equal(45, tools.Count);')
          text = text.replace('Assert.Equal(77, tools.Count);', 'Assert.Equal(78, tools.Count);')
          text = text.replace('Assert.Equal(77, KiokuToolAnnotationsTests.ReviewedToolMatrix.Count);', 'Assert.Equal(78, KiokuToolAnnotationsTests.ReviewedToolMatrix.Count);')
          text = text.replace('// 3. Compare tool counts (44 for default, 77 for all-capabilities)', '// 3. Compare tool counts (45 for default, 78 for all-capabilities)')
          text = text.replace('var expectedCount = enableAllCapabilities ? 77 : 44;', 'var expectedCount = enableAllCapabilities ? 78 : 45;')
          write(path, text)

          path = 'src/Kioku.Mcp.Server.Tests/KiokuToolAnnotationsTests.cs'
          text = read(path)
          text = replace_once(
              text,
              '        ["create_folder_readme"] = (false, true, true, false),\n',
              '        ["create_folder_readme"] = (false, true, true, false),\n        ["create_engineering_spec"] = (false, false, false, false),\n',
              'annotation matrix spec tool')
          text = text.replace('All_77_tools_match_reviewed_annotation_matrix', 'All_78_tools_match_reviewed_annotation_matrix')
          text = text.replace('Assert.Equal(77, ReviewedToolMatrix.Count);', 'Assert.Equal(78, ReviewedToolMatrix.Count);')
          write(path, text)

          path = 'src/Kioku.Mcp.Server.Tests/EngineeringSpecServiceTests.cs'
          text = read(path)
          text = replace_once(
              text,
              '        Assert.Contains($"Spec: [[{specName}]]", plan);\n',
              '',
              'legacy plan body expectation')
          write(path, text)
      - name: Regenerate public contract
        run: node scripts/generate-public-docs.mjs --write
      - name: Commit repairs
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Kioku.Mcp.Server src/Kioku.Mcp.Server.Tests docs/commands-reference.md
          if git diff --cached --quiet; then
            echo "No repairs needed."
            exit 0
          fi
          git commit -m "fix(engineering): preserve project document architecture"
          git push origin "HEAD:${GITHUB_HEAD_REF}"
