name: prepare-dotnet-standardization-v2

on:
  pull_request:
    branches: [develop]
    types: [synchronize]

permissions:
  contents: write

jobs:
  prepare:
    if: github.head_ref == 'agent/dotnet-repo-standardization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/dotnet-repo-standardization

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Recreate corrected repository files
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/prepare-dotnet-standardization.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          script = script.replace(
              '<PackageVersion Include="Microsoft.CodeAnalysis.NetAnalyzers" Version="10.0.0" />',
              '<PackageVersion Include="Microsoft.CodeAnalysis.NetAnalyzers" Version="10.0.100" />',
          )
          exec(compile(script, 'prepare-dotnet-standardization.py', 'exec'))
          PY

          rm -f Kioku.sln Kioku.slnx
          dotnet new sln --name Kioku --format slnx
          dotnet sln Kioku.slnx add \
            src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj \
            src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj \
            scripts/Kioku.Benchmarks/Kioku.Benchmarks.csproj \
            scripts/Kioku.Eval/Kioku.Eval.csproj \
            scripts/GenerateCommandsRef/GenerateCommandsRef.csproj

      - name: Validate restore and solution membership
        run: |
          dotnet restore Kioku.slnx
          dotnet sln Kioku.slnx list

      - name: Commit standardized .NET repository files
        shell: bash
        env:
          HUSKY: "0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add \
            Kioku.slnx \
            global.json \
            Directory.Build.props \
            Directory.Packages.props \
            NuGet.config \
            CONTRIBUTING.md \
            src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj \
            src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj \
            scripts/Kioku.Benchmarks/Kioku.Benchmarks.csproj \
            scripts/Kioku.Eval/Kioku.Eval.csproj \
            scripts/GenerateCommandsRef/GenerateCommandsRef.csproj
          git commit --no-verify -m "chore(repo): standardize dotnet solution and package management"
          git push origin HEAD:agent/dotnet-repo-standardization
