name: apply-dotnet-format

on:
  pull_request:
    branches: [develop]
    types: [synchronize]

permissions:
  contents: write

jobs:
  format:
    if: github.head_ref == 'agent/dotnet-repo-standardization' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/dotnet-repo-standardization

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Restore solution
        run: dotnet restore Kioku.slnx

      - name: Format solution
        run: dotnet format Kioku.slnx --no-restore --verbosity diagnostic

      - name: Commit formatting changes
        shell: bash
        env:
          HUSKY: "0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- '*.cs'
          if git diff --cached --quiet; then
            echo "No source formatting changes were required."
            exit 0
          fi
          git commit --no-verify -m "style(dotnet): apply solution formatting"
          git push origin HEAD:agent/dotnet-repo-standardization
