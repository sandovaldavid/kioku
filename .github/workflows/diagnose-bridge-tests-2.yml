name: diagnose-bridge-tests-visible

on:
  pull_request:
    branches: [develop]

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  diagnose:
    if: github.head_ref == 'agent/harden-obsidian-bridge'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}

      - name: Apply pending lint fixes in workspace
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/obsidian-kioku-mcp/src/bridge.ts')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'message as Extract<BridgeMessage, { command: RuntimeCommand }>',
              'message',
              1)
          text = text.replace(
              'handler(message.payload as Record<string, unknown> | undefined, message.requestId)',
              'handler(message.payload, message.requestId)',
              1)
          path.write_text(text, encoding='utf-8')
          PY

      - uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run plugin tests
        id: tests
        continue-on-error: true
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter obsidian-kioku-mcp run test 2>&1 | tee bridge-visible-tests.log

      - name: Build concise diagnostic
        if: always()
        shell: bash
        run: |
          {
            echo '<!-- kioku-bridge-test-diagnostic -->'
            echo '## Bridge test diagnostic'
            echo
            echo 'Head: `${{ github.sha }}`'
            echo 'Outcome: `${{ steps.tests.outcome }}`'
            echo
            echo '```text'
            grep -E '^( FAIL | × | ❯ |AssertionError|TypeError|Error:| Test Files |      Tests )' bridge-visible-tests.log | tail -n 120 || true
            echo '```'
          } > bridge-comment.md

      - name: Publish diagnostic comment
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const fs = require('fs');
            const marker = '<!-- kioku-bridge-test-diagnostic -->';
            const body = fs.readFileSync('bridge-comment.md', 'utf8');
            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              per_page: 100,
            });
            const existing = comments.find(comment => comment.body?.includes(marker));
            if (existing) {
              await github.rest.issues.updateComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner: context.repo.owner,
                repo: context.repo.repo,
                issue_number: context.issue.number,
                body,
              });
            }

      - name: Preserve failure status
        if: steps.tests.outcome == 'failure'
        run: exit 1
