name: sandbox-patch-pr

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

concurrency:
  group: sandbox-patch-${{ github.head_ref }}
  cancel-in-progress: true

jobs:
  patch:
    if: github.head_ref == 'agent/enforce-filesystem-sandbox' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.head_ref }}
          fetch-depth: 0

      - name: Apply asserted source patches
        shell: bash
        run: python scripts/apply-filesystem-sandbox-patch.py > patch-diagnostic.txt 2>&1

      - name: Upload patch diagnostics
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: sandbox-patch-diagnostic
          path: patch-diagnostic.txt
          if-no-files-found: error
          retention-days: 1

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj

      - name: Apply formatter
        run: dotnet format src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj --no-restore --verbosity minimal

      - name: Commit patches and formatting
        run: |
          if git diff --quiet; then
            echo "No changes required."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/Kioku.Mcp.Server src/Kioku.Mcp.Server.Tests
          git commit -m "security: apply sandbox policy across filesystem operations"
          git push origin HEAD:${{ github.head_ref }}