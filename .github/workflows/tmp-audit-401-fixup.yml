name: temporary-audit-401-fixup

on:
  push:
    branches: [fix/audit-pagination-401]

permissions:
  contents: write

jobs:
  fixup:
    if: ${{ !contains(github.event.head_commit.message, 'preserve legacy preview and sync contract') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/audit-pagination-401
          fetch-depth: 0

      - name: Preserve legacy audit preview and update regression coverage
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          source = Path('src/Kioku.Mcp.Server/Tools/VaultOrganizationTools.cs')
          text = source.read_text()

          replacements = [
              (
                  '[Description("Maximum findings to return per wikilink category (default: 50, capped by KIOKU_MAX_RESULTS).")]',
                  '[Description("Maximum findings to return per wikilink category (default: 50). The effective maximum preserves the legacy 50-item preview and honors larger KIOKU_MAX_RESULTS values.")]',
              ),
              (
                  '        var cappedLimit = Math.Min(limit, config.MaxSearchResults);',
                  '        var maxAuditResults = Math.Max(50, config.MaxSearchResults);\n        var cappedLimit = Math.Min(limit, maxAuditResults);',
              ),
              (
                  '''            foreach (var issue in page.Findings)\n            {\n                sb.AppendLine(CultureInfo.InvariantCulture, $"- {format(issue)}");\n            }\n        }\n\n        sb.AppendLine();''',
                  '''            foreach (var issue in page.Findings)\n            {\n                sb.AppendLine(CultureInfo.InvariantCulture, $"- {format(issue)}");\n            }\n\n            if (page.HasMore)\n            {\n                sb.AppendLine(CultureInfo.InvariantCulture,\n                    $"- _(... and {page.TotalOccurrences - page.Offset - page.Returned} more)_");\n            }\n        }\n\n        sb.AppendLine();''',
              ),
          ]

          for old, new in replacements:
              if old not in text:
                  raise SystemExit(f'expected source fragment not found: {old[:80]}')
              text = text.replace(old, new, 1)
          source.write_text(text)

          tests = Path('src/Kioku.Mcp.Server.Tests/VaultOrganizationToolsAuditPaginationTests.cs')
          test_text = tests.read_text()
          old_test = '''    [Fact]\n    public async Task AuditVault_Caps_page_size_by_max_search_results()\n    {\n        await using var harness = await AuditHarness.CreateAsync(\n            2,\n            ("Source.md", "[[One]] [[Two]] [[Three]]"));\n\n        var result = await harness.Tools.audit_vault(limit: 100);\n        var broken = Broken(result);\n\n        Assert.Equal(2, broken.GetProperty("limit").GetInt32());\n        Assert.Equal(2, broken.GetProperty("returned").GetInt32());\n        Assert.True(broken.GetProperty("has_more").GetBoolean());\n    }\n'''
          new_test = '''    [Fact]\n    public async Task AuditVault_Default_page_preserves_legacy_fifty_item_preview()\n    {\n        var links = string.Join(" ", Enumerable.Range(1, 55).Select(i => $"[[Missing {i:00}]]"));\n        await using var harness = await AuditHarness.CreateAsync(2, ("Source.md", links));\n\n        var result = await harness.Tools.audit_vault();\n        var broken = Broken(result);\n\n        Assert.Equal(55, broken.GetProperty("total_occurrences").GetInt32());\n        Assert.Equal(50, broken.GetProperty("limit").GetInt32());\n        Assert.Equal(50, broken.GetProperty("returned").GetInt32());\n        Assert.True(broken.GetProperty("has_more").GetBoolean());\n        Assert.Contains("... and 5 more", Text(result));\n    }\n\n    [Fact]\n    public async Task AuditVault_Uses_larger_configured_result_bound_for_explicit_pages()\n    {\n        var links = string.Join(" ", Enumerable.Range(1, 80).Select(i => $"[[Missing {i:00}]]"));\n        await using var harness = await AuditHarness.CreateAsync(75, ("Source.md", links));\n\n        var result = await harness.Tools.audit_vault(limit: 100);\n        var broken = Broken(result);\n\n        Assert.Equal(75, broken.GetProperty("limit").GetInt32());\n        Assert.Equal(75, broken.GetProperty("returned").GetInt32());\n        Assert.True(broken.GetProperty("has_more").GetBoolean());\n    }\n'''
          if old_test not in test_text:
              raise SystemExit('expected audit max-results test not found')
          tests.write_text(test_text.replace(old_test, new_test, 1))
          PY

      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"

      - uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Generate public contract from the modified server
        run: |
          dotnet restore src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj
          dotnet build src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj --configuration Release --no-restore
          node scripts/generate-public-docs.mjs --write

      - name: Commit generated contract and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          rm .github/workflows/tmp-audit-401-fixup.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "fix(audit): preserve legacy preview and sync contract"
          git push origin HEAD:fix/audit-pagination-401
