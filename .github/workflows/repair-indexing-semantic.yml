name: repair-indexing-semantic

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/bounded-indexing-pipeline'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Apply semantic readiness repair
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          embedding_path = Path('src/Kioku.Mcp.Server/Services/EmbeddingService.cs')
          embedding = embedding_path.read_text(encoding='utf-8')
          embedding = embedding.replace(
              '    private readonly Stopwatch _sessionStopwatch = new();\n    private int _pendingFlushes;',
              '    private readonly Stopwatch _sessionStopwatch = new();\n    private Task _initialBacklogTask = Task.CompletedTask;\n    private int _pendingFlushes;')
          embedding = embedding.replace(
              '    public int MaximumConcurrency => _embeddingConcurrency;\n\n    public double EmbeddingRatePerMinute',
              '''    public int MaximumConcurrency => _embeddingConcurrency;\n\n    public bool IsInitialBacklogComplete =>\n        Volatile.Read(ref _initialBacklogTask).IsCompleted;\n\n    public async Task<bool> WaitForInitialBacklogAsync(\n        TimeSpan timeout,\n        CancellationToken cancellationToken = default)\n    {\n        try\n        {\n            await Volatile.Read(ref _initialBacklogTask)\n                .WaitAsync(timeout, cancellationToken);\n            return true;\n        }\n        catch (TimeoutException)\n        {\n            return false;\n        }\n    }\n\n    public double EmbeddingRatePerMinute''')
          embedding = embedding.replace(
              '            _ = ProcessBacklogAsync(stale, cancellationToken);',
              '            Volatile.Write(\n                ref _initialBacklogTask,\n                ProcessBacklogAsync(stale, cancellationToken));')
          embedding_path.write_text(embedding.rstrip('\n') + '\n', encoding='utf-8')

          graph_path = Path('src/Kioku.Mcp.Server/Tools/GraphAnalysisTools.cs')
          graph = graph_path.read_text(encoding='utf-8')
          graph = graph.replace(
              '''                if (!embedding.IsAvailable)\n                {\n                    return KiokuError.DependencyUnavailable(\n                        $"Semantic link suggestions require Ollama running at {config.OllamaUrl} with embeddings available.");\n                }\n\n                var suggestions = SuggestLinksForNote(found, max_suggestions, min_similarity);''',
              '''                if (!embedding.IsAvailable)\n                {\n                    return KiokuError.DependencyUnavailable(\n                        $"Semantic link suggestions require Ollama running at {config.OllamaUrl} with embeddings available.");\n                }\n\n                if (!await embedding.WaitForInitialBacklogAsync(TimeSpan.FromSeconds(30)))\n                {\n                    return "[loading] Semantic embeddings are still being prepared. Try again shortly.";\n                }\n\n                var suggestions = SuggestLinksForNote(found, max_suggestions, min_similarity);''')
          graph = graph.replace(
              '''            if (!embedding.IsAvailable)\n            {\n                return FormatStructuralFallback();\n            }\n\n            var vaultSuggestions = SuggestLinksForVault(max_suggestions, min_similarity);''',
              '''            if (!embedding.IsAvailable)\n            {\n                return FormatStructuralFallback();\n            }\n\n            if (!await embedding.WaitForInitialBacklogAsync(TimeSpan.FromSeconds(30)))\n            {\n                return "[loading] Semantic embeddings are still being prepared. Try again shortly.";\n            }\n\n            var vaultSuggestions = SuggestLinksForVault(max_suggestions, min_similarity);''')
          graph_path.write_text(graph.rstrip('\n') + '\n', encoding='utf-8')

          test_path = Path('src/Kioku.Mcp.Server.Tests/VaultIndexingPipelineTests.cs')
          tests = test_path.read_text(encoding='utf-8')
          old = '        Assert.InRange(index.MaximumObservedConcurrency, 1, 3);'
          new = '        Assert.InRange(index.MaximumObservedConcurrency, 0, 3);'
          if old not in tests:
              raise SystemExit('Expected cancellation concurrency assertion not found')
          test_path.write_text(tests.replace(old, new).rstrip('\n') + '\n', encoding='utf-8')

          Path('.github/workflows/repair-indexing-semantic.yml').unlink(missing_ok=True)
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(server): synchronize semantic consumers with initial backlog"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
