name: repair-indexing-pr

on:
  pull_request:
    branches: [develop]

permissions:
  contents: write

jobs:
  repair:
    if: github.event.pull_request.head.ref == 'agent/bounded-indexing-pipeline'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.ref }}
          fetch-depth: 0

      - name: Normalize tests and formatting
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          test_file = Path('src/Kioku.Mcp.Server.Tests/EmbeddingServiceTests.cs')
          content = test_file.read_text(encoding='utf-8')
          old = 'await Task.WhenAll(notes.Select(service.IndexNoteAsync));'
          new = 'await Task.WhenAll(notes.Select(note => service.IndexNoteAsync(note)));'
          if old not in content:
              raise SystemExit('Expected EmbeddingServiceTests call was not found')
          test_file.write_text(content.replace(old, new), encoding='utf-8')

          newline_files = [
              'src/Kioku.Mcp.Server/Hosting/KiokuHostingExtensions.cs',
              'src/Kioku.Mcp.Server/Http/HttpReadinessState.cs',
              'src/Kioku.Mcp.Server/Services/EmbeddingService.cs',
              'src/Kioku.Mcp.Server/Services/VaultIndexingMetrics.cs',
              'src/Kioku.Mcp.Server/Services/VaultIndexingPipeline.cs',
              'src/Kioku.Mcp.Server/Services/VaultIndexOperations.cs',
              'src/Kioku.Mcp.Server/Tools/UtilityTools.cs',
              'src/Kioku.Mcp.Server.Tests/EmbeddingServiceTests.cs',
          ]
          for file_name in newline_files:
              path = Path(file_name)
              text = path.read_text(encoding='utf-8')
              path.write_text(text.rstrip('\n') + '\n', encoding='utf-8')

          Path('.github/workflows/diagnose-indexing-pr.yml').unlink(missing_ok=True)
          Path('.github/workflows/repair-indexing-pr.yml').unlink(missing_ok=True)
          PY

      - name: Commit repair
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "fix(server): normalize indexing tests and formatting"
          git push origin HEAD:${{ github.event.pull_request.head.ref }}
