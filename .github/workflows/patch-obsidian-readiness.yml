name: patch-obsidian-readiness

on:
  push:
    branches: [agent/obsidian-community-readiness]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/obsidian-community-readiness

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Apply Obsidian community-readiness changes
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import json
          import re

          ROOT = Path("src/obsidian-kioku-mcp")

          def read(path: Path) -> str:
              return path.read_text(encoding="utf-8")

          def write(path: Path, content: str) -> None:
              path.parent.mkdir(parents=True, exist_ok=True)
              path.write_text(content.rstrip() + "\n", encoding="utf-8")

          def replace_once(text: str, old: str, new: str, label: str) -> str:
              if old not in text:
                  raise RuntimeError(f"Could not find expected block for {label}")
              return text.replace(old, new, 1)

          # Isolate undocumented Obsidian surfaces behind one guarded adapter.
          write(ROOT / "src/obsidian-compat.ts", r'''
          import { FileSystemAdapter } from "obsidian";
          import type { App } from "obsidian";
          import type { PluginManifest } from "./types";

          interface InternalCommandRegistry {
            executeCommandById?: (commandId: string) => boolean;
          }

          interface InternalPluginRegistry {
            manifests?: Record<string, PluginManifest>;
            enabledPlugins?: Set<string>;
            plugins?: Record<string, unknown>;
          }

          interface InternalAppSurface {
            version?: unknown;
            commands?: InternalCommandRegistry;
            plugins?: InternalPluginRegistry;
          }

          export interface InstalledPluginInfo extends PluginManifest {
            id: string;
            enabled: boolean;
          }

          function internalSurface(app: App): InternalAppSurface {
            return app as App & InternalAppSurface;
          }

          export function getVaultBasePath(app: App): string | null {
            const adapter = app.vault.adapter;
            return adapter instanceof FileSystemAdapter ? adapter.getBasePath() : null;
          }

          export function getObsidianVersion(app: App): string | null {
            const version = internalSurface(app).version;
            return typeof version === "string" && version.length > 0 ? version : null;
          }

          export function executeObsidianCommand(app: App, commandId: string): boolean {
            const execute = internalSurface(app).commands?.executeCommandById;
            if (typeof execute !== "function") {
              return false;
            }

            try {
              return execute.call(internalSurface(app).commands, commandId);
            } catch {
              return false;
            }
          }

          export function getThirdPartyPluginApi<T>(app: App, pluginId: string): T | null {
            const plugin = internalSurface(app).plugins?.plugins?.[pluginId];
            return plugin && typeof plugin === "object" ? (plugin as T) : null;
          }

          export function listInstalledPlugins(app: App): InstalledPluginInfo[] {
            const registry = internalSurface(app).plugins;
            const manifests = registry?.manifests;
            if (!manifests || typeof manifests !== "object") {
              return [];
            }

            const enabled = registry.enabledPlugins ?? new Set<string>();
            return Object.entries(manifests)
              .map(([id, manifest]) => ({
                id,
                name: manifest.name,
                version: manifest.version,
                author: manifest.author,
                description: manifest.description,
                enabled: enabled.has(id),
              }))
              .sort((left, right) => left.name.localeCompare(right.name));
          }
          ''')

          write(ROOT / "src/settings.ts", r'''
          import type { BridgeStatus } from "./status";
          import type { KiokuSettings } from "./types";
          import { DEFAULT_SETTINGS } from "./types";

          function validPort(value: unknown): value is number {
            return typeof value === "number" && Number.isInteger(value) && value > 0 && value < 65_536;
          }

          function booleanOrDefault(value: unknown, fallback: boolean): boolean {
            return typeof value === "boolean" ? value : fallback;
          }

          export function normalizeSettings(saved: Partial<KiokuSettings> | null): KiokuSettings {
            const additionalAllowedCommandIds = Array.isArray(saved?.additionalAllowedCommandIds)
              ? saved.additionalAllowedCommandIds
                  .filter((entry): entry is string => typeof entry === "string")
                  .map((entry) => entry.trim())
                  .filter((entry, index, entries) => entry.length > 0 && entries.indexOf(entry) === index)
                  .slice(0, 64)
              : [];

            return {
              bridgePort: validPort(saved?.bridgePort) ? saved.bridgePort : DEFAULT_SETTINGS.bridgePort,
              showNotifications: booleanOrDefault(
                saved?.showNotifications,
                DEFAULT_SETTINGS.showNotifications
              ),
              showStatusBar: booleanOrDefault(saved?.showStatusBar, DEFAULT_SETTINGS.showStatusBar),
              authToken: typeof saved?.authToken === "string" ? saved.authToken.trim() : "",
              allowEditorMutations: booleanOrDefault(
                saved?.allowEditorMutations,
                DEFAULT_SETTINGS.allowEditorMutations ?? true
              ),
              allowThirdPartyIntegrations: booleanOrDefault(
                saved?.allowThirdPartyIntegrations,
                DEFAULT_SETTINGS.allowThirdPartyIntegrations ?? false
              ),
              allowVaultWideOperations: booleanOrDefault(
                saved?.allowVaultWideOperations,
                DEFAULT_SETTINGS.allowVaultWideOperations ?? false
              ),
              allowUnsafeCommands: booleanOrDefault(
                saved?.allowUnsafeCommands,
                DEFAULT_SETTINGS.allowUnsafeCommands ?? false
              ),
              additionalAllowedCommandIds,
            };
          }

          export function formatBridgeStatusDescription(status: BridgeStatus): string {
            const state = status.running ? "Running" : "Stopped";
            const clients = status.clients === 1 ? "1 connected client" : `${status.clients} connected clients`;
            const authentication = status.authenticationEnabled ? "authentication enabled" : "authentication disabled";
            const protocol =
              status.minProtocolVersion === status.maxProtocolVersion
                ? `protocol v${status.protocolVersion}`
                : `protocol v${status.minProtocolVersion}–${status.maxProtocolVersion}`;

            return `${state} on 127.0.0.1:${status.port}; ${authentication}; ${clients}; ${protocol}; plugin v${status.pluginVersion}.`;
          }
          ''')

          write(ROOT / "src/obsidian-compat.test.ts", r'''
          import { describe, expect, it, vi } from "vitest";
          import type { App } from "obsidian";
          import {
            executeObsidianCommand,
            getObsidianVersion,
            getThirdPartyPluginApi,
            getVaultBasePath,
            listInstalledPlugins,
          } from "./obsidian-compat";
          import { createMockApp } from "./test-utils";

          vi.mock("obsidian", () => import("./__mocks__/obsidian"));

          function app(options: Parameters<typeof createMockApp>[0] = {}): App {
            return createMockApp(options) as unknown as App;
          }

          describe("Obsidian compatibility adapter", () => {
            it("uses FileSystemAdapter only when the public desktop adapter is available", () => {
              const desktop = app({ vaultPath: "/vault" });
              expect(getVaultBasePath(desktop)).toBe("/vault");

              const unsupported = app();
              (unsupported.vault as unknown as { adapter: unknown }).adapter = {};
              expect(getVaultBasePath(unsupported)).toBeNull();
            });

            it("degrades gracefully when command internals are unavailable", () => {
              const current = app({ commands: new Map([["app:test", true]]) });
              expect(executeObsidianCommand(current, "app:test")).toBe(true);

              delete (current as unknown as { commands?: unknown }).commands;
              expect(executeObsidianCommand(current, "app:test")).toBe(false);
            });

            it("reads version and third-party APIs through guarded capability checks", () => {
              const api = { query: () => undefined };
              const current = app({ plugins: { plugins: { dataview: api } } });
              expect(getObsidianVersion(current)).toBe("1.13.1");
              expect(getThirdPartyPluginApi(current, "dataview")).toBe(api);
              expect(getThirdPartyPluginApi(current, "missing")).toBeNull();
            });

            it("lists manifests deterministically and preserves enabled state", () => {
              const current = app({
                plugins: {
                  manifests: {
                    zeta: { name: "Zeta", version: "1.0.0" },
                    alpha: { name: "Alpha", version: "2.0.0" },
                  },
                  enabledPlugins: new Set(["zeta"]),
                },
              });

              expect(listInstalledPlugins(current)).toEqual([
                { id: "alpha", name: "Alpha", version: "2.0.0", author: undefined, description: undefined, enabled: false },
                { id: "zeta", name: "Zeta", version: "1.0.0", author: undefined, description: undefined, enabled: true },
              ]);
            });
          });
          ''')

          write(ROOT / "src/settings.test.ts", r'''
          import { describe, expect, it } from "vitest";
          import { formatBridgeStatusDescription, normalizeSettings } from "./settings";

          describe("normalizeSettings", () => {
            it("migrates incomplete legacy data to secure current defaults", () => {
              expect(normalizeSettings({ bridgePort: 9000, showNotifications: false })).toEqual({
                bridgePort: 9000,
                showNotifications: false,
                showStatusBar: true,
                authToken: "",
                allowEditorMutations: true,
                allowThirdPartyIntegrations: false,
                allowVaultWideOperations: false,
                allowUnsafeCommands: false,
                additionalAllowedCommandIds: [],
              });
            });

            it("rejects invalid ports and normalizes custom command IDs", () => {
              expect(
                normalizeSettings({
                  bridgePort: 70_000,
                  authToken: " token ",
                  additionalAllowedCommandIds: [" test:one ", "test:one", "", "test:two"],
                })
              ).toMatchObject({
                bridgePort: 7765,
                authToken: "token",
                additionalAllowedCommandIds: ["test:one", "test:two"],
              });
            });
          });

          describe("formatBridgeStatusDescription", () => {
            it("reports lifecycle, authentication, clients, protocol and plugin compatibility", () => {
              expect(
                formatBridgeStatusDescription({
                  running: true,
                  port: 7765,
                  clients: 2,
                  protocolVersion: 3,
                  minProtocolVersion: 3,
                  maxProtocolVersion: 3,
                  pluginVersion: "2.3.0",
                  authenticationEnabled: true,
                })
              ).toBe(
                "Running on 127.0.0.1:7765; authentication enabled; 2 connected clients; protocol v3; plugin v2.3.0."
              );
            });
          });
          ''')

          # Remove the broad internal interfaces from the shared protocol types.
          types_path = ROOT / "src/types.ts"
          types_text = read(types_path)
          types_text = replace_once(types_text, 'import type { App } from "obsidian";\n\n', '', "types App import")
          types_text = re.sub(
              r'/\*\*\n \* Internal Obsidian App interface extension\.[\s\S]*?export interface KiokuSettings',
              'export interface KiokuSettings',
              types_text,
              count=1,
          )
          write(types_path, types_text)

          # Route every internal access in handlers through the compatibility adapter.
          handlers_path = ROOT / "src/handlers.ts"
          handlers = read(handlers_path)
          handlers = replace_once(
              handlers,
              'import type { BridgeResponse, KiokuDataAdapter, KiokuSettings, PluginManifest } from "./types";\nimport { asKiokuApp } from "./types";',
              'import type { BridgeResponse, KiokuSettings, PluginManifest } from "./types";\nimport {\n  executeObsidianCommand,\n  getObsidianVersion,\n  getThirdPartyPluginApi,\n  getVaultBasePath,\n  listInstalledPlugins,\n} from "./obsidian-compat";',
              "handlers imports",
          )
          handlers = re.sub(
              r'function cmdGetVaultPath\([\s\S]*?\n}\n\nfunction cmdGetAppVersion',
              '''function cmdGetVaultPath(app: App, requestId?: string): BridgeResponse {
            const vaultPath = getVaultBasePath(app);
            return {
              requestId,
              success: true,
              data: {
                vaultPath: vaultPath ?? "unknown",
                vaultName: app.vault.getName(),
                available: vaultPath !== null,
              },
            };
          }

          function cmdGetAppVersion''',
              handlers,
              count=1,
          )
          handlers = handlers.replace('  const kiokuApp = asKiokuApp(app);\n', '')
          handlers = handlers.replace('      obsidianVersion: kiokuApp.version,', '      obsidianVersion: getObsidianVersion(app) ?? "unknown",')
          handlers = handlers.replace('asKiokuApp(app).commands.executeCommandById', 'executeObsidianCommand')
          handlers = handlers.replace(
              'const dvApi = asKiokuApp(app).plugins.plugins.dataview as',
              'const dvApi = getThirdPartyPluginApi(app, "dataview") as',
          )
          handlers = handlers.replace('  const plugins = asKiokuApp(app).plugins.plugins;\n  const templater = plugins["templater-obsidian"] as', '  const templater = getThirdPartyPluginApi(app, "templater-obsidian") as')
          handlers = re.sub(
              r'function cmdGetInstalledPlugins\([\s\S]*?\n}\s*$',
              '''function cmdGetInstalledPlugins(app: App, requestId?: string): BridgeResponse {
            return {
              requestId,
              success: true,
              data: listInstalledPlugins(app),
            };
          }''',
              handlers,
              count=1,
          )
          write(handlers_path, handlers)

          # Modernize plugin lifecycle, commands, settings and visible compatibility status.
          main_path = ROOT / "src/main.ts"
          main = read(main_path)
          main = replace_once(
              main,
              'import { formatStatusBarText, statusBarCssClass } from "./status";\nimport type { KiokuSettings } from "./types";\nimport { DEFAULT_SETTINGS, PROTOCOL_VERSION } from "./types";',
              'import { formatStatusBarText, statusBarCssClass } from "./status";\nimport { formatBridgeStatusDescription, normalizeSettings } from "./settings";\nimport type { KiokuSettings } from "./types";\nimport { PROTOCOL_MAX_VERSION, PROTOCOL_MIN_VERSION, PROTOCOL_VERSION } from "./types";',
              "main imports",
          )
          main = replace_once(main, '  async onload(): Promise<void> {\n    await this.loadSettings();', '  async onload(): Promise<void> {\n    const loadedAt = performance.now();\n    await this.loadSettings();', "load timing")
          main = replace_once(
              main,
              '    this.app.workspace.onLayoutReady(() => {\n      void this.startBridge();\n    });',
              '''    this.app.workspace.onLayoutReady(() => {
              const deferredMs = Math.round(performance.now() - loadedAt);
              void this.startBridge().then((started) => {
                log.info(
                  started
                    ? `Bridge started after workspace layout became ready (${deferredMs} ms after plugin load).`
                    : `Bridge did not start after workspace layout became ready (${deferredMs} ms after plugin load).`
                );
              });
            });''',
              "deferred bridge startup",
          )
          for old, new in {
              'name: "Restart Kioku MCP Bridge"': 'name: "Restart bridge"',
              'name: "Stop Kioku MCP Bridge"': 'name: "Stop bridge"',
              'name: "Start Kioku MCP Bridge"': 'name: "Start bridge"',
              'name: "Copy Kioku bridge status"': 'name: "Copy bridge status"',
              'name: "Copy Kioku bridge auth token"': 'name: "Copy bridge auth token"',
          }.items():
              main = main.replace(old, new)
          main = re.sub(
              r'        const status: BridgeStatus = \{[\s\S]*?\n        };\n        await navigator\.clipboard',
              '        const status = this.getBridgeStatus();\n        await navigator.clipboard',
              main,
              count=1,
          )
          main = re.sub(
              r'  async restartBridge\(showNotice = true\): Promise<void> \{[\s\S]*?\n  }\n\n  async startBridge',
              '''  async restartBridge(showNotice = true): Promise<boolean> {
              let started = false;
              await this.enqueueBridgeTransition(async () => {
                await this.stopBridgeInternal();
                started = this.startBridgeInternal();
              });
              if (showNotice) {
                new Notice(
                  started
                    ? "Kioku MCP Bridge restarted on port " + this.settings.bridgePort
                    : "Kioku MCP Bridge could not restart. Check the developer console for details."
                );
              }
              return started;
            }

            async startBridge''',
              main,
              count=1,
          )
          main = replace_once(
              main,
              '  refreshStatusBarVisibility(): void {',
              '''  getBridgeStatus(): BridgeStatus {
              return {
                running: this.bridge?.isRunning ?? false,
                port: this.settings.bridgePort,
                clients: this.bridge?.clientCount ?? 0,
                protocolVersion: PROTOCOL_VERSION,
                minProtocolVersion: PROTOCOL_MIN_VERSION,
                maxProtocolVersion: PROTOCOL_MAX_VERSION,
                pluginVersion: this.manifest.version,
                authenticationEnabled: Boolean(this.settings.authToken),
              };
            }

            refreshStatusBarVisibility(): void {''',
              "bridge status method",
          )
          main = re.sub(
              r'  async loadSettings\(\): Promise<void> \{[\s\S]*?\n  }\n\n  async saveSettings',
              '''  async loadSettings(): Promise<void> {
              const saved = (await this.loadData()) as Partial<KiokuSettings> | null;
              this.settings = normalizeSettings(saved);
            }

            async saveSettings''',
              main,
              count=1,
          )
          main = main.replace('    containerEl.createEl("h2", { text: "Kioku MCP — Settings" });\n\n', '')
          main = replace_once(
              main,
              '    new Setting(containerEl)\n      .setName("Bridge port")',
              '''    const bridgeStatus = this.plugin.getBridgeStatus();
            new Setting(containerEl)
              .setName("Bridge status")
              .setDesc(formatBridgeStatusDescription(bridgeStatus))
              .addButton((button) =>
                button
                  .setButtonText(bridgeStatus.running ? "Restart" : "Start")
                  .setTooltip("Apply the saved configuration and refresh bridge status")
                  .onClick(async () => {
                    await this.plugin.restartBridge(false);
                    this.display();
                  })
              );

            new Setting(containerEl)
              .setName("Bridge port")''',
              "bridge status setting",
          )
          main = main.replace(
              '    containerEl.createEl("h3", { text: "Bridge permissions" });',
              '    new Setting(containerEl).setName("Bridge permissions").setHeading();',
          )
          write(main_path, main)

          # Extend copied/settings status with compatibility and authentication state.
          status_path = ROOT / "src/status.ts"
          status = read(status_path)
          status = replace_once(
              status,
              '  protocolVersion: number;\n  pluginVersion: string;',
              '  protocolVersion: number;\n  minProtocolVersion: number;\n  maxProtocolVersion: number;\n  pluginVersion: string;\n  authenticationEnabled: boolean;',
              "status fields",
          )
          write(status_path, status)

          # Make the Obsidian mock exercise the public FileSystemAdapter guard.
          mock_path = ROOT / "src/__mocks__/obsidian.ts"
          mock = read(mock_path)
          mock = replace_once(
              mock,
              'export class TFile {',
              '''export class FileSystemAdapter {
              constructor(private readonly basePath: string) {}

              getBasePath(): string {
                return this.basePath;
              }
            }

            export class TFile {''',
              "FileSystemAdapter mock",
          )
          mock = mock.replace('  adapter: { basePath?: string };', '  adapter: FileSystemAdapter | Record<string, never>;')
          write(mock_path, mock)

          test_utils_path = ROOT / "src/test-utils.ts"
          test_utils = read(test_utils_path)
          test_utils = test_utils.replace('import { MarkdownView } from "./__mocks__/obsidian";', 'import { FileSystemAdapter, MarkdownView } from "./__mocks__/obsidian";')
          test_utils = test_utils.replace('    adapter: { basePath: options.vaultPath ?? "/tmp/test-vault" },', '    adapter: new FileSystemAdapter(options.vaultPath ?? "/tmp/test-vault"),')
          test_utils = test_utils.replace('(app as unknown as Record<string, unknown>).version = "1.8.0";', '(app as unknown as Record<string, unknown>).version = "1.13.1";')
          test_utils = test_utils.replace('// Attach internal API surface used by asKiokuApp.', '// Attach the guarded internal surface exercised by obsidian-compat.ts.')
          write(test_utils_path, test_utils)

          # Preserve the handler contract while exposing adapter availability.
          handlers_test_path = ROOT / "src/handlers.test.ts"
          handlers_test = read(handlers_test_path)
          handlers_test = handlers_test.replace(
              'expect(result.data).toEqual({ vaultPath: "/home/user/vault", vaultName: "TestVault" });',
              'expect(result.data).toEqual({ vaultPath: "/home/user/vault", vaultName: "TestVault", available: true });',
          )
          handlers_test = handlers_test.replace(
              'expect(result.data).toEqual({ obsidianVersion: "1.8.0", kiokuVersion: "1.8.0-beta.5" });',
              'expect(result.data).toEqual({ obsidianVersion: "1.13.1", kiokuVersion: "1.8.0-beta.5" });',
          )
          write(handlers_test_path, handlers_test)

          # Minify production builds and enforce a reviewed bundle budget.
          esbuild_path = ROOT / "esbuild.config.mjs"
          esbuild = read(esbuild_path)
          esbuild = esbuild.replace('import { builtinModules } from "module";', 'import { builtinModules } from "module";\nimport { statSync } from "node:fs";')
          esbuild = esbuild.replace('  treeShaking: true,', '  treeShaking: true,\n  minify: prod,\n  legalComments: "none",')
          esbuild = replace_once(
              esbuild,
              '''if (prod) {
            await context.rebuild();
            process.exit(0);
          } else {''',
              '''if (prod) {
            await context.rebuild();
            await context.dispose();

            const bundleBytes = statSync("main.js").size;
            const bundleBudgetBytes = 512 * 1024;
            console.log(`Production bundle: ${(bundleBytes / 1024).toFixed(1)} KiB / 512 KiB budget`);
            if (bundleBytes > bundleBudgetBytes) {
              throw new Error(`main.js exceeds the 512 KiB bundle budget (${bundleBytes} bytes).`);
            }
          } else {''',
              "production bundle budget",
          )
          write(esbuild_path, esbuild)

          write(ROOT / "validate-release.mjs", r'''
          import { existsSync, readFileSync, statSync } from "node:fs";

          const manifest = JSON.parse(readFileSync("manifest.json", "utf8"));
          const pkg = JSON.parse(readFileSync("package.json", "utf8"));
          const versions = JSON.parse(readFileSync("versions.json", "utf8"));
          const failures = [];

          const requiredManifestFields = ["id", "name", "version", "minAppVersion", "description", "author"];
          for (const field of requiredManifestFields) {
            if (typeof manifest[field] !== "string" || manifest[field].trim().length === 0) {
              failures.push(`manifest.json is missing a valid '${field}'.`);
            }
          }

          if (manifest.id !== "kioku-mcp") failures.push("manifest id must remain 'kioku-mcp'.");
          if (manifest.isDesktopOnly !== true) failures.push("the bridge must remain desktop-only.");
          if (manifest.version !== pkg.version) failures.push("package.json and manifest.json versions differ.");
          if (versions[manifest.version] !== manifest.minAppVersion) {
            failures.push("versions.json must map the current plugin version to minAppVersion.");
          }

          for (const asset of ["main.js", "manifest.json", "styles.css"]) {
            if (!existsSync(asset)) failures.push(`missing release asset: ${asset}`);
          }

          if (existsSync("main.js")) {
            const bundle = readFileSync("main.js", "utf8");
            const size = statSync("main.js").size;
            if (size > 512 * 1024) failures.push(`main.js exceeds the 512 KiB budget (${size} bytes).`);
            if (bundle.includes("sourceMappingURL=")) failures.push("production main.js contains a source map reference.");
            if (bundle.includes("console.debug(")) failures.push("production main.js contains debug logging.");
          }

          if (failures.length > 0) {
            console.error(failures.map((failure) => `- ${failure}`).join("\n"));
            process.exit(1);
          }

          console.log(
            `Validated ${manifest.id} v${manifest.version} for Obsidian ${manifest.minAppVersion}+ (${(statSync("main.js").size / 1024).toFixed(1)} KiB).`
          );
          ''')

          write(ROOT / "validate-compatibility.mjs", r'''
          import { readFileSync, readdirSync } from "node:fs";
          import { join } from "node:path";

          const sourceDirectory = "src";
          const adapterPath = "src/obsidian-compat.ts";
          const forbidden = [
            [".commands.executeCommandById", "command registry access"],
            [".plugins.plugins", "third-party plugin registry access"],
            [".plugins.manifests", "plugin manifest registry access"],
            [".plugins.enabledPlugins", "enabled plugin registry access"],
            ["adapter.basePath", "filesystem adapter basePath access"],
          ];

          function files(directory) {
            return readdirSync(directory, { withFileTypes: true }).flatMap((entry) => {
              const path = join(directory, entry.name);
              return entry.isDirectory() ? files(path) : path.endsWith(".ts") ? [path] : [];
            });
          }

          const failures = [];
          for (const path of files(sourceDirectory)) {
            if (path === adapterPath || path.includes("/__mocks__/") || path.endsWith(".test.ts")) continue;
            const content = readFileSync(path, "utf8");
            for (const [needle, label] of forbidden) {
              if (content.includes(needle)) failures.push(`${path}: direct ${label}; use obsidian-compat.ts`);
            }
          }

          if (failures.length > 0) {
            console.error(failures.map((failure) => `- ${failure}`).join("\n"));
            process.exit(1);
          }

          console.log("Obsidian internal API access is isolated behind obsidian-compat.ts.");
          ''')

          # Pin the API package, add release/compatibility checks, and keep versions.json in source.
          package_path = ROOT / "package.json"
          package_json = json.loads(read(package_path))
          package_json["scripts"]["version"] = "node version-bump.mjs && git add manifest.json versions.json"
          package_json["scripts"]["check:compatibility"] = "node validate-compatibility.mjs"
          package_json["scripts"]["validate:release"] = "node validate-release.mjs"
          package_json["devDependencies"]["obsidian"] = "1.13.1"
          write(package_path, json.dumps(package_json, indent=2))

          manifest_path = ROOT / "manifest.json"
          manifest = json.loads(read(manifest_path))
          manifest["minAppVersion"] = "1.13.0"
          manifest["description"] = (
              "Connects Obsidian to the Kioku MCP server so Claude Code, Codex, OpenCode, and "
              "compatible agents can safely interact with the current vault."
          )
          write(manifest_path, json.dumps(manifest, indent=2))
          write(ROOT / "versions.json", json.dumps({manifest["version"]: manifest["minAppVersion"]}, indent=2))

          lock_path = Path("pnpm-lock.yaml")
          lock = read(lock_path)
          lock = replace_once(lock, "      obsidian:\n        specifier: latest\n        version: 1.13.1", "      obsidian:\n        specifier: 1.13.1\n        version: 1.13.1", "pinned Obsidian lockfile")
          write(lock_path, lock)

          version_bump_path = ROOT / "version-bump.mjs"
          version_bump = read(version_bump_path)
          version_bump = version_bump.replace('console.log(`Version bumped to ${targetVersion}`);', 'console.log(`Version bumped to ${targetVersion}; minimum Obsidian version ${manifest.minAppVersion}.`);')
          write(version_bump_path, version_bump)

          write(ROOT / "README.md", r'''
          # Kioku MCP Plugin

          Kioku MCP Plugin is the desktop-only Obsidian bridge for the Kioku MCP server. It lets Claude Code, Codex, OpenCode, Antigravity, and other compatible MCP clients coordinate with the open Obsidian application while the server remains responsible for vault indexing and filesystem access.

          ## Requirements

          - Obsidian 1.13.0 or newer on desktop.
          - Kioku MCP Server configured with the same vault and bridge settings.
          - A shared bridge token is strongly recommended.

          ## Installation

          Until the plugin has its independent repository and Community listing, install the `main.js`, `manifest.json`, and `styles.css` release assets in `<vault>/.obsidian/plugins/kioku-mcp/`, then enable **Kioku MCP** in Obsidian.

          Configure the server with matching values:

          ```bash
          export KIOKU_VAULT_PATH=/path/to/vault
          export KIOKU_OBSIDIAN_PORT=7765
          export KIOKU_BRIDGE_TOKEN=<same token configured in Obsidian>
          ```

          ## Settings

          - **Bridge status** shows running/stopped state, loopback address, authentication state, connected clients, protocol range, and plugin version.
          - **Bridge port** defaults to `7765`; a valid change restarts the bridge automatically.
          - **Auth token** is the shared handshake secret. Generate or replace it in settings and update `KIOKU_BRIDGE_TOKEN` on the server. Token changes restart the bridge automatically.
          - **Show notifications** controls bridge and security notices.
          - **Show status bar** displays bridge state and client count; clicking it restarts the bridge.
          - **Allow editor mutations** permits cursor, selection, note creation, and snippet reload commands.
          - **Allow third-party integrations** permits guarded Dataview, Templater, and per-file Linter operations.
          - **Allow vault-wide operations** permits explicitly supported whole-vault operations and requires third-party integrations.
          - **Allow unsafe custom commands** permits only the additional command IDs explicitly listed by the user.

          Configuration changes that affect the listener, authentication, or command policy are persisted and applied through a serialized bridge restart.

          ## Lifecycle and compatibility

          `onload()` only loads settings and registers UI/commands. The WebSocket listener starts after `workspace.onLayoutReady()` and logs measured deferred startup time. Production builds are minified, omit source maps, and must remain below the reviewed 512 KiB bundle budget.

          Undocumented Obsidian command and plugin registries are isolated in `src/obsidian-compat.ts` with capability detection and graceful fallback. Vault path access uses the public `FileSystemAdapter` type and an `instanceof` guard. The bridge protocol currently supports version 3.

          ## Security limitations

          - The bridge binds only to `127.0.0.1`; it is not a remote-access service.
          - Without an auth token, any local process can attempt a handshake.
          - Third-party and vault-wide operations are disabled by default.
          - Custom command execution is allowlisted; arbitrary discovery is not exposed.
          - The plugin has no telemetry and does not send note contents to a cloud service.

          ## Troubleshooting

          ### Bridge does not start

          Confirm the configured port is free and inspect the Obsidian developer console. The settings page reports stopped state and provides a **Start** action.

          ### Server cannot connect

          Confirm Obsidian is open, the plugin is enabled, port and token match the server, and the server supports bridge protocol version 3.

          ### Configuration changed but behavior is stale

          Listener and permission changes restart automatically. Use **Restart bridge** from the command palette or click the status bar item to force a refresh.

          ### Third-party command is unavailable

          Enable the relevant plugin, enable **Allow third-party integrations**, and confirm the installed plugin version still exposes the integration capability. Kioku returns a dependency-unavailable response instead of assuming internal APIs exist.

          ## Development

          ```bash
          pnpm install --frozen-lockfile
          pnpm --filter obsidian-kioku-mcp run check:compatibility
          pnpm --filter obsidian-kioku-mcp run test
          pnpm --filter obsidian-kioku-mcp run build
          pnpm --filter obsidian-kioku-mcp run validate:release
          ```

          For manual testing, create a disposable vault, copy/link this plugin directory to `.obsidian/plugins/kioku-mcp`, run `pnpm --filter obsidian-kioku-mcp run dev`, enable the plugin, and use Obsidian's startup stopwatch plus developer console to record load behavior.

          See [RELEASE_CHECKLIST.md](RELEASE_CHECKLIST.md) and [CHANGELOG.md](CHANGELOG.md).

          ## License

          MIT © sandovaldavid
          ''')

          write(ROOT / "CHANGELOG.md", r'''
