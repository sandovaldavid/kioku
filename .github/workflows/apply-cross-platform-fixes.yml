name: apply-cross-platform-fixes

on:
  pull_request:
    branches: [develop]
    types: [synchronize]

permissions:
  contents: write

jobs:
  fix:
    if: github.head_ref == 'agent/ci-release-quality-gates' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/ci-release-quality-gates

      - name: Apply cross-platform fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(content: str, old: str, new: str, description: str) -> str:
              count = content.count(old)
              if count != 1:
                  raise RuntimeError(f"Expected one {description} block, found {count}.")
              return content.replace(old, new)

          embedding = Path('src/Kioku.Mcp.Server/Services/EmbeddingService.cs')
          content = embedding.read_text(encoding='utf-8')
          content = replace_once(
              content,
              '''        foreach (var (key, value) in loaded)
              {
                  cancellationToken.ThrowIfCancellationRequested();
                  _store[key] = value;
              }
          ''',
              '''        foreach (var (_, value) in loaded)
              {
                  cancellationToken.ThrowIfCancellationRequested();
                  var relativePath = NormalizeVaultRelativePath(value.VaultRelativePath);
                  _store[relativePath] = value with { VaultRelativePath = relativePath };
              }
          ''',
              'loaded embedding normalization')
          content = replace_once(
              content,
              '''        var relative = Path.GetRelativePath(config.VaultPath, filePath);
                  _store.TryRemove(relative, out _);
          ''',
              '''        var relative = NormalizeVaultRelativePath(
                      Path.GetRelativePath(config.VaultPath, filePath));
                  _store.TryRemove(relative, out _);
          ''',
              'embedding removal path')
          content = replace_once(
              content,
              '''        var oldRelative = Path.GetRelativePath(config.VaultPath, oldFilePath);
                  var newRelative = Path.GetRelativePath(config.VaultPath, newFilePath);
          ''',
              '''        var oldRelative = NormalizeVaultRelativePath(
                      Path.GetRelativePath(config.VaultPath, oldFilePath));
                  var newRelative = NormalizeVaultRelativePath(
                      Path.GetRelativePath(config.VaultPath, newFilePath));
          ''',
              'embedding move paths')
          content = replace_once(
              content,
              '''                var absolutePath = Path.Combine(config.VaultPath, entry.VaultRelativePath);
          ''',
              '''                var absolutePath = ResolveVaultAbsolutePath(entry.VaultRelativePath);
          ''',
              'semantic lookup path')
          content = replace_once(
              content,
              '''    public float[]? GetVector(string vaultRelativePath) =>
                  _store.TryGetValue(vaultRelativePath, out var entry)
                      ? entry.Chunks[0].Vector
                      : null;
          
              public Task<float[]?> EmbedQueryAsync(
          ''',
              '''    public float[]? GetVector(string vaultRelativePath) =>
                  _store.TryGetValue(NormalizeVaultRelativePath(vaultRelativePath), out var entry)
                      ? entry.Chunks[0].Vector
                      : null;
          
              private string ResolveVaultAbsolutePath(string vaultRelativePath)
              {
                  var nativeRelativePath = NormalizeVaultRelativePath(vaultRelativePath)
                      .Replace('/', Path.DirectorySeparatorChar);
                  return Path.GetFullPath(Path.Combine(config.VaultPath, nativeRelativePath));
              }
          
              private static string NormalizeVaultRelativePath(string path) =>
                  path.Replace('\\', '/').Trim().TrimStart('/');
          
              public Task<float[]?> EmbedQueryAsync(
          ''',
              'embedding path helpers')
          content = replace_once(
              content,
              '''        if (chunks.Count > 0)
                  {
                      _store[note.VaultRelativePath] = new EmbeddingEntry(
                          note.VaultRelativePath,
                          note.ContentHash,
                          chunks);
                      _failedPaths.TryRemove(note.VaultRelativePath, out _);
                  }
                  else
                  {
                      _failedPaths[note.VaultRelativePath] = 0;
                  }
          ''',
              '''        var relativePath = NormalizeVaultRelativePath(note.VaultRelativePath);
                  if (chunks.Count > 0)
                  {
                      _store[relativePath] = new EmbeddingEntry(
                          relativePath,
                          note.ContentHash,
                          chunks);
                      _failedPaths.TryRemove(relativePath, out _);
                  }
                  else
                  {
                      _failedPaths[relativePath] = 0;
                  }
          ''',
              'embedded note storage path')
          embedding.write_text(content, encoding='utf-8')

          tests = Path('src/Kioku.Mcp.Server.Tests/VaultIndexingPipelineTests.cs')
          content = tests.read_text(encoding='utf-8')
          content = replace_once(
              content,
              '''        for (var edit = 0; edit < 100; edit++)
                  {
                      await File.WriteAllTextAsync(notePath, $"edit {edit}");
                      pipeline.EnqueueChangeForTest(notePath);
                  }
          ''',
              '''        for (var change = 0; change < 100; change++)
                  {
                      pipeline.EnqueueChangeForTest(notePath);
                  }
          ''',
              'coalescing burst')
          tests.write_text(content, encoding='utf-8')

          Path('.github/workflows/apply-cross-platform-fixes.yml').unlink()
          PY

      - name: Commit fixes
        shell: bash
        env:
          HUSKY: "0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit --no-verify -m "fix(server): normalize embedding paths across platforms"
          git push origin HEAD:agent/ci-release-quality-gates
