name: run-obsidian-patch-on-pr

on:
  pull_request:
    branches: [develop]
    types: [opened, synchronize, reopened]

permissions:
  contents: write

jobs:
  patch:
    if: github.head_ref == 'agent/obsidian-community-readiness' && github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7
        with:
          ref: agent/obsidian-community-readiness

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Execute embedded patch
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          workflow = Path('.github/workflows/patch-obsidian-readiness.yml').read_text(encoding='utf-8')
          marker = "          python3 <<'PY'\n"
          start = workflow.index(marker) + len(marker)
          end = workflow.index("\n          PY", start)
          script = textwrap.dedent(workflow[start:end])
          exec(compile(script, 'obsidian-readiness-patch.py', 'exec'))
          PY

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Format changed plugin sources
        working-directory: src/obsidian-kioku-mcp
        run: pnpm exec prettier --write src README.md CHANGELOG.md RELEASE_CHECKLIST.md '*.mjs'

      - name: Commit plugin patch
        shell: bash
        env:
          HUSKY: "0"
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml src/obsidian-kioku-mcp
          git commit --no-verify -m "refactor(plugin): align lifecycle and release readiness"
          git push origin HEAD:agent/obsidian-community-readiness
