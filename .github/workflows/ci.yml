name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-server:
    name: build-server (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj

      - name: Build
        run: dotnet build src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj --configuration Release --no-restore --runtime linux-x64

      - name: Build (osx-arm64 cross-check)
        run: dotnet build src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj --configuration Release --no-restore --runtime osx-arm64

      - name: Format check
        run: dotnet format src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj --verify-no-changes --verbosity minimal

      - name: Vulnerability check
        run: dotnet list src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj package --vulnerable

  test-server:
    name: test-server (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj

      - name: Test with coverage
        run: dotnet test src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj --configuration Release --no-restore --verbosity minimal --collect:"XPlat Code Coverage" --results-directory ./coverage

      - name: Upload coverage to Codecov
        if: runner.os == 'Linux'
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/**/coverage.cobertura.xml
          flags: server
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build-plugin:
    name: build-plugin (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Type-check
        run: pnpm --filter obsidian-kioku-mcp exec tsc --noEmit -p tsconfig.json

      - name: Lint
        run: pnpm --filter obsidian-kioku-mcp run lint

      - name: Format check
        run: pnpm --filter obsidian-kioku-mcp run format:check

      - name: Test
        run: pnpm --filter obsidian-kioku-mcp run test

      - name: Build
        run: pnpm --filter obsidian-kioku-mcp run build

  validate-integrations:
    name: validate-integrations (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate JSON syntax
        run: |
          for f in \
            .claude-plugin/marketplace.json \
            integrations/claude-code-plugin/.claude-plugin/plugin.json \
            integrations/claude-code-plugin/.mcp.json \
            integrations/antigravity-plugin/plugin.json \
            integrations/antigravity-plugin/mcp_config.json \
            integrations/antigravity-plugin/hooks/hooks.json; do
            echo "Checking $f"
            node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8'))"
          done

      - name: Validate SKILL.md frontmatter
        run: node scripts/lib/validate-skill-frontmatter.mjs

      - name: Check kioku-vault skill is in sync
        run: ./scripts/sync-skill.sh --check

      - name: Shellcheck
        run: |
          shellcheck scripts/add-to-client.sh scripts/sync-skill.sh scripts/install.sh scripts/sync-develop-to-main.sh

      - name: Dry-run add-to-client.sh for every client
        run: |
          mkdir -p /tmp/fake-vault
          for client in claude-code codex opencode antigravity; do
            ./scripts/add-to-client.sh "$client" --vault /tmp/fake-vault --dry-run --yes
          done