name: ci

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-server:
    name: build-server (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Restore solution
        run: dotnet restore Kioku.slnx

      - name: Build solution
        shell: bash
        run: |
          set -o pipefail
          dotnet build Kioku.slnx --configuration Release --no-restore 2>&1 | tee dotnet-build.log

      - name: Upload failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: dotnet-build-diagnostics
          path: dotnet-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Build server (linux-x64)
        run: dotnet build src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj --configuration Release --no-restore --runtime linux-x64

      - name: Build server (osx-arm64 cross-check)
        run: dotnet build src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj --configuration Release --no-restore --runtime osx-arm64

      - name: Pack .NET tool
        run: dotnet pack src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj --configuration Release --no-restore --output ./artifacts/packages

      - name: Format check
        shell: bash
        run: |
          set -o pipefail
          dotnet format Kioku.slnx --verify-no-changes --no-restore --verbosity diagnostic 2>&1 | tee dotnet-format.log

      - name: Upload failed format diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: dotnet-format-diagnostics
          path: dotnet-format.log
          if-no-files-found: error
          retention-days: 7

      - name: Vulnerability check
        run: dotnet list Kioku.slnx package --vulnerable --include-transitive

  test-server:
    name: test-server (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Restore solution
        run: dotnet restore Kioku.slnx

      - name: Test with coverage
        shell: bash
        run: |
          set -o pipefail
          dotnet test src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj --configuration Release --no-restore --verbosity minimal --collect:"XPlat Code Coverage" --logger "trx;LogFileName=test-results.trx" --results-directory ./coverage 2>&1 | tee dotnet-test.log

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: server-test-results-Linux
          path: |
            dotnet-test.log
            coverage/**/*.trx
            coverage/**/coverage.cobertura.xml
          if-no-files-found: error
          retention-days: 7

      - name: Upload coverage to Codecov
        if: success()
        uses: codecov/codecov-action@v7
        with:
          files: ./coverage/**/coverage.cobertura.xml
          flags: server
          fail_ci_if_error: false
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  test-filesystem-sandbox:
    name: test-filesystem-sandbox (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.x"

      - name: Restore
        run: dotnet restore src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj

      - name: Test filesystem security contracts
        shell: bash
        run: |
          set -o pipefail
          dotnet test src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj \
            --configuration Release \
            --no-restore \
            --verbosity minimal \
            --logger "trx;LogFileName=filesystem-results.trx" \
            --results-directory ./filesystem-results \
            --filter "FullyQualifiedName~VaultPathPolicyTests|FullyQualifiedName~VaultIndexSandboxTests|FullyQualifiedName~SecureResearchToolsTests|FullyQualifiedName~PermanentDeletePolicyTests|FullyQualifiedName~NoteHelpersTests" \
            2>&1 | tee filesystem-test.log

      - name: Upload failed filesystem diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: filesystem-test-results-${{ runner.os }}
          path: |
            filesystem-test.log
            filesystem-results/**/*.trx
          if-no-files-found: error
          retention-days: 7

  build-plugin:
    name: build-plugin (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11.9.0
          run_install: false

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: "pnpm"
          cache-dependency-path: "pnpm-lock.yaml"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Audit dependencies
        run: pnpm audit --audit-level=high

      - name: Type-check
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter obsidian-kioku-mcp exec tsc --noEmit -p tsconfig.json 2>&1 | tee plugin-typecheck.log

      - name: Compatibility API audit
        run: pnpm --filter obsidian-kioku-mcp run check:compatibility

      - name: Lint
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter obsidian-kioku-mcp run lint 2>&1 | tee plugin-lint.log

      - name: Format check
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter obsidian-kioku-mcp run format:check 2>&1 | tee plugin-format.log

      - name: Test
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter obsidian-kioku-mcp run test 2>&1 | tee plugin-test.log

      - name: Build
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter obsidian-kioku-mcp run build 2>&1 | tee plugin-build.log

      - name: Validate release assets
        run: pnpm --filter obsidian-kioku-mcp run validate:release

      - name: Upload plugin diagnostics
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: plugin-diagnostics
          path: |
            plugin-*.log
            src/obsidian-kioku-mcp/coverage/**
          if-no-files-found: warn
          retention-days: 7

  validate-integrations:
    name: validate-integrations (ubuntu-latest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"

      - name: Validate JSON syntax
        run: |
          for f in \
            .claude-plugin/marketplace.json \
            integrations/claude-code-plugin/.claude-plugin/plugin.json \
            integrations/claude-code-plugin/.mcp.json \
            integrations/antigravity-plugin/plugin.json \
            integrations/antigravity-plugin/mcp_config.json \
            integrations/antigravity-plugin/hooks/hooks.json; do
            echo "Checking $f"
            node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8'))"
          done

      - name: Validate SKILL.md frontmatter
        run: node scripts/lib/validate-skill-frontmatter.mjs

      - name: Check kioku-vault skill is in sync
        run: ./scripts/sync-skill.sh --check

      - name: Shellcheck
        run: |
          shellcheck scripts/add-to-client.sh scripts/sync-skill.sh scripts/install.sh scripts/sync-develop-to-main.sh

      - name: Dry-run add-to-client.sh for every client
        run: |
          mkdir -p /tmp/fake-vault
          for client in claude-code codex opencode antigravity; do
            ./scripts/add-to-client.sh "$client" --vault /tmp/fake-vault --dry-run --yes
          done
