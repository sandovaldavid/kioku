name: ci

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, develop]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  classify-changes:
    name: classify-changes
    runs-on: ubuntu-latest
    outputs:
      docs_only: ${{ steps.classify.outputs.docs_only }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Classify pull request changes
        id: classify
        shell: bash
        run: |
          set -euo pipefail

          # Pushes to main and manual runs always execute the complete CI matrix.
          if [[ "$GITHUB_EVENT_NAME" != "pull_request" ]]; then
            echo "docs_only=false" >> "$GITHUB_OUTPUT"
            echo "Non-pull-request event: full CI required."
            exit 0
          fi

          base="${{ github.event.pull_request.base.sha }}"
          mapfile -t changed_files < <(git diff --name-only "$base"...HEAD)

          # Fail safe: an empty or unknown change set runs the full matrix.
          docs_only=true
          if [[ ${#changed_files[@]} -eq 0 ]]; then
            docs_only=false
          fi

          for file in "${changed_files[@]}"; do
            case "$file" in
              README.md | AGENTS.md | CONTRIBUTING.md | docs/*)
                ;;
              *)
                docs_only=false
                ;;
            esac
          done

          printf 'docs_only=%s\n' "$docs_only" >> "$GITHUB_OUTPUT"
          printf 'Changed files:\n'
          printf '  %s\n' "${changed_files[@]}"
          printf 'Documentation-only: %s\n' "$docs_only"

  commit-message-check:
    name: conventional-commits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit messages
        shell: bash
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            range="$base..HEAD"
          else
            range="HEAD~1..HEAD"
          fi
          for sha in $(git rev-list "$range"); do
            git log -1 --format=%B "$sha" > /tmp/commit-msg.txt
            .githooks/commit-msg /tmp/commit-msg.txt
          done

  build-server:
    name: build-server (ubuntu-latest)
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore solution
        run: dotnet restore Kioku.slnx

      - name: Build solution
        shell: bash
        run: |
          set -o pipefail
          dotnet build Kioku.slnx --configuration Release --no-restore 2>&1 | tee dotnet-build.log

      - name: Upload failed build diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-build-diagnostics
          path: dotnet-build.log
          if-no-files-found: error
          retention-days: 7

      - name: Build server (linux-x64)
        run: dotnet build src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj --configuration Release --no-restore --runtime linux-x64

      - name: Build server (osx-arm64 cross-check)
        run: dotnet build src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj --configuration Release --no-restore --runtime osx-arm64

      - name: Pack .NET tool
        run: dotnet pack src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj --configuration Release --no-restore --output ./artifacts/packages

      - name: Format check
        shell: bash
        run: |
          set -o pipefail
          {
            dotnet format Kioku.slnx whitespace --verify-no-changes --no-restore --verbosity diagnostic
            dotnet format Kioku.slnx style --verify-no-changes --no-restore --verbosity diagnostic
          } 2>&1 | tee dotnet-format.log

      - name: Upload failed format diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-format-diagnostics
          path: dotnet-format.log
          if-no-files-found: warn
          retention-days: 7

      - name: Vulnerability check
        run: dotnet list Kioku.slnx package --vulnerable --include-transitive

      - name: Generate .NET package inventory
        shell: bash
        run: |
          mkdir -p artifacts/inventory
          dotnet list Kioku.slnx package --include-transitive --format json > artifacts/inventory/dotnet-packages.json

      - name: Upload package inventory
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-package-inventory
          path: artifacts/inventory/dotnet-packages.json
          if-no-files-found: error
          retention-days: 30

  test-server:
    name: test-server (${{ matrix.os }})
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.docs_only != 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore solution
        run: dotnet restore Kioku.slnx

      - name: Test with coverage
        if: runner.os == 'Linux'
        shell: bash
        run: |
          set -o pipefail
          dotnet test src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj \
            --configuration Release \
            --no-restore \
            --verbosity minimal \
            --collect:"XPlat Code Coverage" \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./test-results \
            2>&1 | tee dotnet-test.log

      - name: Test natively
        if: runner.os != 'Linux'
        shell: bash
        run: |
          set -o pipefail
          dotnet test src/Kioku.Mcp.Server.Tests/Kioku.Mcp.Server.Tests.csproj \
            --configuration Release \
            --no-restore \
            --verbosity minimal \
            --logger "trx;LogFileName=test-results.trx" \
            --results-directory ./test-results \
            2>&1 | tee dotnet-test.log

      - name: Enforce server coverage baseline
        if: runner.os == 'Linux'
        run: python3 scripts/verify-coverage.py --pattern "test-results/**/coverage.cobertura.xml" --minimum 40

      - name: Upload failed test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: server-test-results-${{ runner.os }}
          path: |
            dotnet-test.log
            test-results/**/*.trx
            test-results/**/coverage.cobertura.xml
          if-no-files-found: warn
          retention-days: 7

      # Local coverage is the protected-branch gate. Codecov remains informational so
      # pull requests from forks are not blocked by unavailable repository secrets.
      - name: Upload coverage to Codecov
        if: runner.os == 'Linux' && success()
        uses: codecov/codecov-action@v7
        with:
          files: ./test-results/**/coverage.cobertura.xml
          flags: server
          fail_ci_if_error: false
          verbose: true
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  package-smoke:
    name: package-smoke (${{ matrix.os }})
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.docs_only != 'true' }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Restore solution
        run: dotnet restore Kioku.slnx

      - name: Build MCP smoke client
        run: dotnet build scripts/Kioku.Ci/Kioku.Ci.csproj --configuration Release --no-restore

      - name: Pack local .NET tool
        run: dotnet pack src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj --configuration Release --no-restore --output ./artifacts/packages

      - name: Install tool from isolated local feed
        shell: bash
        run: |
          set -euo pipefail
          TOOL_DIR="$RUNNER_TEMP/kioku-tool"
          mkdir -p "$TOOL_DIR"
          cat > "$RUNNER_TEMP/kioku-smoke-nuget.config" <<EOF
          <configuration>
            <packageSources>
              <clear />
              <add key="local" value="$GITHUB_WORKSPACE/artifacts/packages" />
              <add key="nuget.org" value="https://api.nuget.org/v3/index.json" protocolVersion="3" />
            </packageSources>
            <packageSourceMapping>
              <packageSource key="local">
                <package pattern="kioku-mcp-server*" />
              </packageSource>
              <packageSource key="nuget.org">
                <package pattern="*" />
              </packageSource>
            </packageSourceMapping>
          </configuration>
          EOF
          dotnet tool install \
            --tool-path "$TOOL_DIR" \
            --configfile "$RUNNER_TEMP/kioku-smoke-nuget.config" \
            kioku-mcp-server \
            2>&1 | tee package-install.log
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "KIOKU_TOOL=$TOOL_DIR/kioku.exe" >> "$GITHUB_ENV"
          else
            echo "KIOKU_TOOL=$TOOL_DIR/kioku" >> "$GITHUB_ENV"
          fi

      - name: Smoke installed tool over stdio
        shell: bash
        run: |
          set -euo pipefail
          VAULT="$RUNNER_TEMP/kioku-tool-vault"
          mkdir -p "$VAULT"
          printf '# Seed\n\nPackage smoke fixture.\n' > "$VAULT/seed.md"
          mkdir -p "$VAULT/.kioku"
          printf 'capabilities:\n  require_explicit: true\n  enabled:\n    - coordination\n    - sessions\n' > "$VAULT/.kioku/config.yml"
          mkdir -p "$VAULT/Sessions"
          cp "$GITHUB_WORKSPACE/scripts/Kioku.Ci/Fixtures/PreProfile/Legacy Session.md" "$VAULT/Sessions/Legacy Session.md"
          dotnet run \
            --project scripts/Kioku.Ci/Kioku.Ci.csproj \
            --configuration Release \
            --no-build \
            -- \
            --transport stdio \
            --command "$KIOKU_TOOL" \
            --vault "$VAULT" \
            --coordination \
            --timeout-seconds 90 \
            2>&1 | tee stdio-smoke.log

      - name: Resolve native runtime
        shell: bash
        run: |
          set -euo pipefail
          case "$RUNNER_OS/$RUNNER_ARCH" in
            Linux/X64) RID=linux-x64 ;;
            Linux/ARM64) RID=linux-arm64 ;;
            Windows/X64) RID=win-x64 ;;
            Windows/ARM64) RID=win-arm64 ;;
            macOS/X64) RID=osx-x64 ;;
            macOS/ARM64) RID=osx-arm64 ;;
            *) echo "Unsupported native runner: $RUNNER_OS/$RUNNER_ARCH" >&2; exit 1 ;;
          esac
          echo "NATIVE_RID=$RID" >> "$GITHUB_ENV"

      - name: Publish native single-file server
        shell: bash
        run: |
          set -euo pipefail
          dotnet publish src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj \
            --configuration Release \
            --no-restore \
            --runtime "$NATIVE_RID" \
            --output "$RUNNER_TEMP/kioku-publish"
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            echo "KIOKU_NATIVE=$RUNNER_TEMP/kioku-publish/Kioku.Mcp.Server.exe" >> "$GITHUB_ENV"
          else
            chmod +x "$RUNNER_TEMP/kioku-publish/Kioku.Mcp.Server"
            echo "KIOKU_NATIVE=$RUNNER_TEMP/kioku-publish/Kioku.Mcp.Server" >> "$GITHUB_ENV"
          fi

      - name: Smoke native binary over Streamable HTTP
        shell: bash
        run: |
          set -euo pipefail
          VAULT="$RUNNER_TEMP/kioku-http-vault"
          mkdir -p "$VAULT"
          printf '# Seed\n\nHTTP smoke fixture.\n' > "$VAULT/seed.md"
          mkdir -p "$VAULT/.kioku"
          printf 'capabilities:\n  require_explicit: true\n  enabled:\n    - coordination\n    - sessions\n' > "$VAULT/.kioku/config.yml"
          mkdir -p "$VAULT/Sessions"
          cp "$GITHUB_WORKSPACE/scripts/Kioku.Ci/Fixtures/PreProfile/Legacy Session.md" "$VAULT/Sessions/Legacy Session.md"
          dotnet run \
            --project scripts/Kioku.Ci/Kioku.Ci.csproj \
            --configuration Release \
            --no-build \
            -- \
            --transport http \
            --command "$KIOKU_NATIVE" \
            --vault "$VAULT" \
            --endpoint "http://127.0.0.1:5273/mcp" \
            --api-key "kioku-ci-smoke-token" \
            --coordination \
            --timeout-seconds 120 \
            2>&1 | tee http-smoke.log

      - name: Upload package smoke artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: package-smoke-${{ runner.os }}-${{ runner.arch }}
          path: |
            artifacts/packages/*.nupkg
            package-install.log
            stdio-smoke.log
            http-smoke.log
            ${{ runner.temp }}/kioku-publish/**
          if-no-files-found: warn
          retention-days: 7

  validate-integrations:
    name: validate-integrations (ubuntu-latest)
    needs: classify-changes
    if: ${{ needs.classify-changes.outputs.docs_only != 'true' }}
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: "10.x"
          cache: true
          cache-dependency-path: "**/packages.lock.json"

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Restore server
        run: dotnet restore src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj

      - name: Build server
        run: dotnet build src/Kioku.Mcp.Server/Kioku.Mcp.Server.csproj --configuration Release --no-restore

      - name: Validate JSON syntax
        run: |
          for f in \
            .claude-plugin/marketplace.json \
            integrations/claude-code-plugin/.claude-plugin/plugin.json \
            integrations/claude-code-plugin/.mcp.json \
            integrations/antigravity-plugin/plugin.json \
            integrations/antigravity-plugin/mcp_config.json; do
            echo "Checking $f"
            node -e "JSON.parse(require('fs').readFileSync('$f', 'utf8'))"
          done

      - name: Validate SKILL.md frontmatter
        run: node scripts/lib/validate-skill-frontmatter.mjs

      - name: Check kioku-vault skill is in sync
        run: ./scripts/sync-skill.sh --check

      - name: Verify generated public contracts
        run: node scripts/generate-public-docs.mjs --check

      - name: Shellcheck
        run: |
          shellcheck scripts/sync-skill.sh scripts/install.sh scripts/sync-develop-to-main.sh

      - name: Validate portable client configurations
        run: node scripts/validate-portable-configs.mjs
