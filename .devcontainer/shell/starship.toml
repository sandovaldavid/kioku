"$schema" = "https://starship.rs/config-schema.json"

add_newline = true
command_timeout = 2000
palette = "kioku"

format = """
[╭─](bold blue)$os$username$hostname$container${custom.kioku}$directory$git_branch$git_state$git_status$fill$dotnet$nodejs$cmd_duration
[╰─](bold blue)$character"""

right_format = "$status$jobs"

[palettes.kioku]
blue = "#7aa2f7"
cyan = "#7dcfff"
foreground = "#c0caf5"
green = "#9ece6a"
muted = "#565f89"
orange = "#ff9e64"
purple = "#bb9af7"
red = "#f7768e"
yellow = "#e0af68"

[os]
disabled = false
format = "[$symbol]($style)"
style = "bold blue"

[os.symbols]
Linux = " "
Ubuntu = " "

[username]
show_always = false
format = "[$user]($style)"
style_user = "bold cyan"

[hostname]
ssh_only = true
format = "[@$hostname]($style) "
style = "bold cyan"
ssh_symbol = " "

[container]
format = "[$symbol$name]($style) "
style = "bold cyan"
symbol = " "

[custom.kioku]
command = "printf '記憶 Kioku'"
when = """root="$(git rev-parse --show-toplevel 2>/dev/null)" && test -f "$root/Kioku.slnx" """
shell = ["bash", "--noprofile", "--norc"]
format = "[$output]($style) "
style = "bold purple"

[directory]
format = "[$path]($style)[$read_only]($read_only_style) "
home_symbol = "~"
read_only = " 󰌾"
read_only_style = "bold red"
style = "bold blue"
truncate_to_repo = true
truncation_length = 4
truncation_symbol = "…/"

[directory.substitutions]
".devcontainer" = " devcontainer"
"docs" = "󰈙 docs"
"scripts" = "󰆍 scripts"
"src" = "󰅩 src"

[git_branch]
format = "[$symbol$branch(:$remote_branch)]($style) "
style = "bold purple"
symbol = " "

[git_state]
format = "[$state( $progress_current/$progress_total)]($style) "
style = "bold yellow"

[git_status]
format = "[$all_status$ahead_behind]($style)"
style = "bold foreground"
conflicted = "[ ${count}](red) "
ahead = "[ ${count}](blue) "
behind = "[ ${count}](blue) "
diverged = "[  ${ahead_count}  ${behind_count}](blue) "
untracked = "[ ${count}](cyan) "
stashed = "[ ${count}](green) "
modified = "[ ${count}](yellow) "
staged = "[ ${count}](green) "
renamed = "[ ${count}](blue) "
deleted = "[ ${count}](red) "

[fill]
symbol = " "

[dotnet]
format = "via [$symbol($version )]($style)"
heuristic = true
style = "bold purple"
symbol = " "

[nodejs]
format = "via [$symbol($version )]($style)"
style = "bold green"
symbol = " "

[cmd_duration]
format = "took [$duration]($style) "
min_time = 1000
show_milliseconds = false
style = "bold yellow"

[status]
disabled = false
format = "[$symbol$status]($style) "
map_symbol = true
pipestatus = true
style = "bold red"
symbol = " "

[jobs]
format = "[$symbol$number]($style) "
style = "bold cyan"
symbol = "󰜎 "

[character]
success_symbol = "[❯](bold green)"
error_symbol = "[❯](bold red)"
vimcmd_symbol = "[❮](bold blue)"
